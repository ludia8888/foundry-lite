# gitleaks configuration — Sprint quality-gate roadmap P9.
#
# gitleaks scans the working tree (and optionally the full git history) for
# strings that look like API keys, tokens, or credentials. Unlike Bandit and
# Semgrep, it inspects strings as data, not as code shape, so it catches
# secrets pasted into docs, configs, scripts, and YAML.
#
# Inherit the upstream default rule set, then add Foundry-lite-specific
# allowlist entries with explicit reasons. Every entry must cite the rule
# that fires and the reason the value is not a real secret.

[extend]
useDefault = true

# A `*SecretRef` field holds a pointer into the secret vault, never a credential. That
# separation is the point of the virtual-table connection design: the runtime resolves the
# reference through the vault, and a test asserts the resolved URL never reaches an artifact ref
# or a manifest. generic-api-key fires on the field name plus the entropy of the path itself.
#
# Scope is the value shape, not the file, so the surrounding test keeps being scanned. The
# The `"?` after the field name covers both spellings the value appears in: a JSON document
# quotes the key, a TypeScript or JavaScript object literal does not, and the same pointer is
# written both ways across API payloads and the SDK request-contract tests.
# character class admits only pointer-shaped values -- no `:`, `@`, or whitespace, so a URL or a
# `user:password` pair assigned to one of these fields is not allowlisted here. Note that this
# is containment, not detection: gitleaks' default rules do not flag a bare connection string in
# this position either way (verified against a `useDefault`-only config), so the narrow pattern
# limits what this entry can hide rather than adding a check.
[[allowlists]]
description = "Vault pointers assigned to *SecretRef fields"
regexTarget = "match"
regexes = ['''[A-Za-z]*[Ss]ecretRef"?\s*:\s*"[A-Za-z0-9][A-Za-z0-9._/-]*"''']

# Plural `[[allowlists]]` throughout: gitleaks 8.30 refuses to load a config that mixes the
# deprecated singular `[allowlist]` table with the plural form.
[[allowlists]]
description = "Foundry-lite documented false positives"
paths = [
  # The development plan documents the Idempotency-Key HTTP header with an
  # illustrative value (e.g. ABC123). gitleaks' generic-api-key heuristic
  # would otherwise flag it. The value is shown only as a header example.
  '''foundry_lite_development_plan_ko_sprintified\.md''',
  # Local runtime state is generated during API/SDK contract checks, smoke
  # gates, diagnostics, performance probes, and pytest workers. These roots
  # match the repo's `.gitignore` `.foundry-lite*/` rule; OAuth private keys
  # inside them are machine-local artifacts, not committed product secrets.
  '''^\.foundry-lite[^/]*/.*''',
  # Claude/Codex side worktrees can contain their own ignored Foundry-lite
  # local runtime homes. Treat those nested generated homes like the root
  # `.foundry-lite*/` local state instead of forcing deletion of user-owned
  # side-worktree files.
  '''^\.claude/worktrees/[^/]+/\.foundry-lite[^/]*/.*''',
  # Local API/SDK contract and smoke runs can use an ignored development
  # runtime home under artifacts. It may contain generated OAuth/private
  # vault keys used only by the machine-local runtime profile.
  '''^artifacts/dev-foundry-runtime/.*''',
  # The gitleaks JSON report is generated under ignored artifacts and can
  # contain redacted findings from a failed scan, which would otherwise make
  # the secret scanner recursively fail on its own report.
  '''^artifacts/quality/gitleaks\.json$''',
]
