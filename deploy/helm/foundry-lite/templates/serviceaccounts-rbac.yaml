apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foundry-lite.fullname" . }}-api
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "foundry-lite.fullname" . }}-api-release
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
rules:
  - apiGroups: ["release.foundry-lite.io"]
    resources: ["foundrydeployments"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "foundry-lite.fullname" . }}-api-release
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "foundry-lite.fullname" . }}-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "foundry-lite.fullname" . }}-api-release
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foundry-lite.fullname" . }}-release-controller
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "foundry-lite.fullname" . }}-release-controller
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
rules:
  - apiGroups: ["release.foundry-lite.io"]
    resources: ["foundrydeployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["release.foundry-lite.io"]
    resources: ["foundrydeployments/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "foundry-lite.fullname" . | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "foundry-lite.fullname" . }}-release-controller
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "foundry-lite.fullname" . }}-release-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "foundry-lite.fullname" . }}-release-controller
{{- if .Values.secrets.bootstrapOauthSigningSecret }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foundry-lite.fullname" . }}-oauth-bootstrap
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "foundry-lite.fullname" . }}-oauth-bootstrap
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-19"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.oauthSigningExistingSecret | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "foundry-lite.fullname" . }}-oauth-bootstrap
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-18"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "foundry-lite.fullname" . }}-oauth-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "foundry-lite.fullname" . }}-oauth-bootstrap
{{- end }}
