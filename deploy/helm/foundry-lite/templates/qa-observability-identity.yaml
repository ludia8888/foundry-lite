{{- if .Values.qaDependencies.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ include "foundry-lite.fullname" . }}-prometheus}
spec:
  serviceName: {{ include "foundry-lite.fullname" . }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "foundry-lite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "foundry-lite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: {{ .Values.qaDependencies.prometheus.image }}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=25h]
          securityContext: {{- include "foundry-lite.containerSecurityContext" . | nindent 12 }}
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: {{ include "foundry-lite.fullname" . }}-prometheus}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.qaDependencies.prometheus.storage }}}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "foundry-lite.fullname" . }}-prometheus}
spec:
  selector:
    {{- include "foundry-lite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports: [{name: http, port: 9090}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ include "foundry-lite.fullname" . }}-tempo}
spec:
  serviceName: {{ include "foundry-lite.fullname" . }}-tempo
  replicas: 1
  selector:
    matchLabels:
      {{- include "foundry-lite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tempo
  template:
    metadata:
      labels:
        {{- include "foundry-lite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tempo
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tempo
          image: {{ .Values.qaDependencies.tempo.image }}
          args: [-config.file=/etc/tempo/tempo.yaml]
          securityContext: {{- include "foundry-lite.containerSecurityContext" . | nindent 12 }}
          ports: [{name: http, containerPort: 3200}, {name: otlp-http, containerPort: 4318}]
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo, readOnly: true}
            - {name: data, mountPath: /var/tempo}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: {{ include "foundry-lite.fullname" . }}-tempo}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.qaDependencies.tempo.storage }}}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "foundry-lite.fullname" . }}-tempo}
spec:
  selector:
    {{- include "foundry-lite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
  ports: [{name: http, port: 3200}, {name: otlp-http, port: 4318}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ include "foundry-lite.fullname" . }}-grafana}
spec:
  serviceName: {{ include "foundry-lite.fullname" . }}-grafana
  replicas: 1
  selector:
    matchLabels:
      {{- include "foundry-lite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "foundry-lite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 0, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: {{ .Values.qaDependencies.grafana.image }}
          securityContext: {{- include "foundry-lite.containerSecurityContext" . | nindent 12 }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: GRAFANA_ADMIN_USER}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: GRAFANA_ADMIN_PASSWORD}}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.qaDependencies.grafana.storage }}}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "foundry-lite.fullname" . }}-grafana}
spec:
  selector:
    {{- include "foundry-lite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports: [{name: http, port: 3000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ include "foundry-lite.fullname" . }}-keycloak}
spec:
  serviceName: {{ include "foundry-lite.fullname" . }}-keycloak
  replicas: 1
  selector:
    matchLabels:
      {{- include "foundry-lite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "foundry-lite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: keycloak
          image: {{ .Values.qaDependencies.keycloak.image }}
          args: [start, --import-realm, --features=parameterized-scopes, --http-enabled=true, --hostname-strict=true, --proxy-headers=xforwarded]
          securityContext: {{- include "foundry-lite.containerSecurityContext" . | nindent 12 }}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: {{ printf "jdbc:postgresql://%s-postgresql:5432/keycloak" (include "foundry-lite.fullname" .) | quote }}}
            - {name: KC_DB_USERNAME, value: postgres}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: POSTGRES_PASSWORD}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_ADMIN}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_ADMIN_PASSWORD}}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HOSTNAME, value: {{ .Values.qaDependencies.keycloak.publicBaseUrl | quote }}}
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 9000}]
          readinessProbe: {httpGet: {path: /health/ready, port: management}, initialDelaySeconds: 20, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: management}, initialDelaySeconds: 60, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: realm, configMap: {name: {{ include "foundry-lite.fullname" . }}-keycloak-realm}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "foundry-lite.fullname" . }}-keycloak}
spec:
  type: {{ .Values.qaDependencies.keycloak.service.type }}
  selector:
    {{- include "foundry-lite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      port: 8080
      {{- if eq .Values.qaDependencies.keycloak.service.type "NodePort" }}
      nodePort: {{ .Values.qaDependencies.keycloak.service.nodePort }}
      {{- end }}
    - {name: management, port: 9000}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "foundry-lite.fullname" . }}-keycloak-user-bootstrap-{{ .Release.Revision }}
  labels:
    {{- include "foundry-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-user-bootstrap
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 420
  template:
    metadata:
      labels:
        {{- include "foundry-lite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-user-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "foundry-lite.podSecurityContext" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-keycloak
          image: {{ include "foundry-lite.image" (list .Values.images.api .) }}
          command: [/opt/foundry-lite-venv/bin/python, /app/scripts/operations/wait_for_tcp.py]
          args: [--host, {{ include "foundry-lite.fullname" . }}-keycloak, --port, "8080", --timeout-seconds, "300"]
          securityContext: {{- include "foundry-lite.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      containers:
        - name: bootstrap-user
          image: {{ include "foundry-lite.image" (list .Values.images.api .) }}
          command: [/opt/foundry-lite-venv/bin/python, /app/scripts/operations/bootstrap_keycloak_qa_user.py]
          args: [--base-url, {{ printf "http://%s-keycloak:8080" (include "foundry-lite.fullname" .) | quote }}]
          securityContext: {{- include "foundry-lite.containerSecurityContext" . | nindent 12 }}
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_ADMIN}}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_ADMIN_PASSWORD}}
            - name: KEYCLOAK_QA_AUTHOR_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_QA_AUTHOR_USER}}
            - name: KEYCLOAK_QA_AUTHOR_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_QA_AUTHOR_USER_PASSWORD}}
            - name: KEYCLOAK_QA_REVIEWER_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_QA_REVIEWER_USER}}
            - name: KEYCLOAK_QA_REVIEWER_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.qaDependencies.credentialsExistingSecret }}, key: KEYCLOAK_QA_REVIEWER_USER_PASSWORD}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
{{- end }}
