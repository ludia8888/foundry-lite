apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foundry-lite.fullname" . }}
  labels:
    {{- include "foundry-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    foundry-lite.io/service-id: {{ .Values.api.serviceId | quote }}
    foundry-lite.io/image-repository: {{ .Values.images.api.repository | quote }}
    foundry-lite.io/release-trigger: manual
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "foundry-lite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "foundry-lite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        foundry-lite.io/revision: {{ .Values.global.revision | quote }}
    spec:
      serviceAccountName: {{ include "foundry-lite.fullname" . }}-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.api.containerName }}
          image: {{ include "foundry-lite.image" (list .Values.images.api .) }}
          imagePullPolicy: IfNotPresent
          securityContext: {{- include "foundry-lite.containerSecurityContext" . | nindent 12 }}
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}, protocol: TCP}
          envFrom:
            - configMapRef: {name: {{ include "foundry-lite.fullname" . }}-runtime}
            - secretRef: {name: {{ .Values.secrets.applicationExistingSecret }}}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: runtime, mountPath: /var/data}
            - name: oauth-signing
              mountPath: /var/run/foundry-lite/oauth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: runtime
          persistentVolumeClaim: {claimName: {{ include "foundry-lite.fullname" . }}-runtime}
        - name: oauth-signing
          secret:
            secretName: {{ .Values.secrets.oauthSigningExistingSecret }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foundry-lite.fullname" . }}-api
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "foundry-lite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 10000, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "foundry-lite.fullname" . }}-api
  labels: {{- include "foundry-lite.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "foundry-lite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
