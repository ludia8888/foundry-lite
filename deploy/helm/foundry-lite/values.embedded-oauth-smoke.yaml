# Pre-production-only hosted OAuth smoke. This intentionally remains an
# unprotected test profile because local header trust is not valid in staging
# or production. The production OIDC switch also selects the separate bounded
# runtime database Secret before protected Pods roll out.
global:
  runtimeProfile: test

auth:
  profile: header-trust
  localOAuthIssuer: https://foundry.invalid
  dynamicClientApplicationId: foundry-lite
  localConsentRoles: tenant_admin ops_manager ontology_admin action_executor

mcp:
  publicBaseUrl: https://foundry.invalid
  authorizationServer: ""

external:
  oidc:
    discoveryUrl: ""
