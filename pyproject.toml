[project]
name = "foundry-lite"
version = "0.1.0"
description = "Foundry-lite MVP core: replayable data-to-ontology-to-action closed loop."
requires-python = ">=3.12"
dependencies = [
  "click>=8.3.3",
  "duckdb>=1.0",
  "fastapi>=0.110",
  "fastembed>=0.8.0",
  "faster-whisper>=1.2.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-sdk>=1.25",
  "pillow>=12.3.0",
  "prometheus-client>=0.20",
  "pydantic>=2.0",
  "pyjwt[crypto]>=2.13.0",
  "pypdf>=6.14.2",
  "python-multipart>=0.0.32",
  "pytesseract>=0.3.13",
  "pytz>=2026.2",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "uvicorn>=0.29",
  "websockets>=15.0",
]

[project.optional-dependencies]
kafka = [
  "confluent-kafka>=2.6",
]
elasticsearch = [
  "elasticsearch>=8.15",
]
s3 = [
  "boto3>=1.35",
]
iceberg = [
  "pyiceberg>=0.8",
  "pyarrow>=17.0",
]
temporal = [
  "temporalio>=1.7",
]
spark = [
  "pyspark>=3.5",
]
postgres = [
  "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
  "alembic>=1.13",
  "bandit>=1.7",
  "boto3>=1.35",
  "httpx2>=2.3.0",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pyright>=1.1",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "testcontainers[postgres]>=4.7",
  "radon>=6.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "xenon>=0.9",
  "import-linter>=2.11",
  "pytest-randomly>=4.1.0",
  "pytest-xdist>=3.8.0",
  "mutmut>=3.6.0",
  "hypothesis>=6.155.2",
  "vulture>=2.16",
  "interrogate>=1.7.0",
  "tach==0.35.0",
  "gitpython>=3.1.55",
  "confluent-kafka>=2.6",
  "pyiceberg>=0.8",
  "pyarrow>=17.0",
  "pyspark>=3.5",
  "temporalio>=1.7",
  "elasticsearch>=8.15",
]

[project.scripts]
flite = "foundry_lite_cli.main:main"

[tool.pytest.ini_options]
pythonpath = [".", "libs", "apps/api", "apps/cli", "apps/worker"]
testpaths = ["tests"]
markers = [
  "integration_scenario(name): marks one of the seven required MVP release integration scenarios",
]

[tool.coverage.run]
branch = true
source = ["libs/foundry_lite"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["mutants", "migrations/versions", "scripts/vulture_allowlist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
exclude = ['scripts/vulture_allowlist\.py']
# scripts/sdk_generator must map to the single module name
# scripts.sdk_generator.* (the entrypoint imports it by that name); without
# explicit package bases mypy maps the same files under a second name and
# fails with "source file found twice".
explicit_package_bases = true
# scripts/quality is its own base so its same-directory sibling import
# (_proof_matrix_lib) keeps resolving as a top-level module.
mypy_path = ["libs", "apps/api", "apps/cli", "apps/worker", "scripts/quality"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pyright]
include = ["libs", "apps/api", "apps/cli", "apps/worker", "scripts"]
extraPaths = ["libs", "apps/api", "apps/cli", "apps/worker"]
exclude = [
  "**/__pycache__",
  ".venv",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "mutants",
  "scripts/vulture_allowlist.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
# Strict mode is enabled for the domain layer where business rules live —
# the same layer §4.1 forbids from importing any framework. We tighten the
# nets here first because the strict checks are tractable (small surface,
# no Any), then expand to application once the new boundary catches up.
strict = ["libs/foundry_lite/domain", "libs/foundry_lite/application/ports", "libs/foundry_lite/security", "libs/foundry_lite/application/services/base.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".mypy_cache", ".pytest_cache", ".ruff_cache"]
skips = ["B101"]

[tool.radon]
exclude = ".venv,.mypy_cache,.pytest_cache,.ruff_cache"

[tool.mutmut]
# Mutation testing — Sprint quality-gate roadmap P4.
#
# Mutmut deliberately mutates source code (>= becomes >, +1 becomes -1, etc.)
# then runs the test suite. Surviving mutants prove that 97% line coverage
# can still hide untested branches; killed mutants prove the suite actually
# catches the bug class.
#
# CURRENT STATE (2026-06-10): the baseline pytest run inside mutants/ passes,
# meaning the tree copies and tests pass against unmodified source. The stat
# collection step (mutmut 4.x's new mechanism to figure out which test covers
# which mutant) reports "no test case for any mutant" even though tests
# exercise these modules. This is an open issue with mutmut 4.x and the
# pytest plugin layering; the gate is staged but not yet wired into ci_gate.sh
# until upstream fixes or we move to alternative (e.g. cosmic-ray).
#
# Until then, `uv run mutmut run` validates that the tree is mutmut-ready and
# can be re-enabled in CI in a single line change once the stat issue is
# resolved.
source_paths = [
  "libs/foundry_lite/domain",
  "libs/foundry_lite/application/safe_expression.py",
  "libs/foundry_lite/application/primitives.py",
  "libs/foundry_lite/security",
]
runner = "uv run pytest -x -q --no-header -p no:randomly -p no:cacheprovider"
pytest_add_cli_args_test_selection = ["tests/contracts", "tests/unit"]
