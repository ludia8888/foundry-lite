[project]
name = "foundry-lite"
version = "0.1.0"
description = "Foundry-lite MVP core: replayable data-to-ontology-to-action closed loop."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0",
  "fastapi>=0.110",
  "opentelemetry-api>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-sdk>=1.25",
  "prometheus-client>=0.20",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "uvicorn>=0.29",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "bandit>=1.7",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "radon>=6.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "xenon>=0.9",
]

[project.scripts]
flite = "foundry_lite_cli.main:main"

[tool.pytest.ini_options]
pythonpath = [".", "libs", "apps/api", "apps/cli", "apps/worker"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["libs/foundry_lite"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pyright]
include = ["libs", "apps/api", "apps/cli", "apps/worker", "scripts"]
extraPaths = ["libs", "apps/api", "apps/cli", "apps/worker"]
exclude = [
  "**/__pycache__",
  ".venv",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".mypy_cache", ".pytest_cache", ".ruff_cache"]
skips = ["B101"]

[tool.radon]
exclude = ".venv,.mypy_cache,.pytest_cache,.ruff_cache"
