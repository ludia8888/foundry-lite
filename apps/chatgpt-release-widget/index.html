<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:"
    />
    <title>Foundry-lite Governed Release</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #171a18;
        --ink-soft: #555b56;
        --paper: #f2f0e8;
        --paper-raised: #fbfaf5;
        --line: #c8c5b9;
        --signal: #166149;
        --signal-wash: #dbe8df;
        --warn: #8a4f13;
        --warn-wash: #f0dfc7;
        --danger: #9c332c;
        --danger-wash: #f0d7d3;
        --muted: #e3e0d6;
        --focus: #1267a8;
        --shadow: rgba(20, 24, 21, 0.12);
        font-family: "Avenir Next", Avenir, "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 280px;
        background: transparent;
        color: var(--ink);
      }

      body {
        padding: 10px;
      }

      button {
        font: inherit;
      }

      .shell {
        position: relative;
        width: min(100%, 760px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--paper);
        box-shadow: 0 12px 34px var(--shadow);
      }

      .shell::before {
        position: absolute;
        inset: 0 auto 0 0;
        width: 6px;
        background: var(--signal);
        content: "";
      }

      .masthead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 22px 18px 26px;
        border-bottom: 1px solid var(--line);
        background: var(--paper-raised);
      }

      .eyebrow,
      .mono,
      .meta-label,
      .step-index,
      .receipt-key {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--signal);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 4vw, 29px);
        font-weight: 720;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }

      .kind-mark {
        flex: 0 0 auto;
        padding: 7px 9px 6px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper-raised);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .manifest {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(220px, 0.8fr);
      }

      .primary,
      .control {
        min-width: 0;
      }

      .primary {
        padding: 22px 22px 22px 26px;
      }

      .control {
        padding: 22px;
        border-left: 1px solid var(--line);
        background: var(--paper-raised);
      }

      .status-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 12px;
        margin-bottom: 18px;
      }

      .status-word {
        color: var(--signal);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .release-id {
        max-width: 100%;
        overflow: hidden;
        color: var(--ink-soft);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rail {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        margin: 0 0 24px;
        padding: 0;
        list-style: none;
      }

      .rail-step {
        position: relative;
        min-width: 0;
        padding-top: 20px;
        color: var(--ink-soft);
        font-size: 10px;
        font-weight: 700;
      }

      .rail-step::before,
      .rail-step::after {
        position: absolute;
        top: 6px;
        content: "";
      }

      .rail-step::before {
        left: 0;
        z-index: 1;
        width: 8px;
        height: 8px;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: var(--paper);
      }

      .rail-step::after {
        right: 0;
        left: 10px;
        height: 2px;
        background: var(--line);
      }

      .rail-step:last-child::after {
        display: none;
      }

      .rail-step.is-done::before,
      .rail-step.is-current::before {
        border-color: var(--signal);
        background: var(--signal);
      }

      .rail-step.is-done::after {
        background: var(--signal);
      }

      .rail-step.is-current {
        color: var(--ink);
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 820;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .section-label::after {
        flex: 1;
        height: 1px;
        background: var(--line);
        content: "";
      }

      .summary {
        margin: 0 0 20px;
        color: var(--ink-soft);
        font-size: 13px;
        line-height: 1.55;
      }

      .evidence-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .evidence-item {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: start;
        padding-bottom: 8px;
        border-bottom: 1px dotted var(--line);
        font-size: 12px;
        line-height: 1.4;
      }

      .evidence-dot {
        display: grid;
        width: 16px;
        height: 16px;
        place-items: center;
        border-radius: 50%;
        background: var(--signal-wash);
        color: var(--signal);
        font-size: 10px;
        font-weight: 900;
      }

      .evidence-dot.is-failed {
        background: var(--danger-wash);
        color: var(--danger);
      }

      .evidence-state {
        color: var(--ink-soft);
        font-size: 10px;
        font-weight: 750;
        text-transform: uppercase;
      }

      .empty-copy {
        margin: 0;
        padding: 12px;
        border: 1px dashed var(--line);
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.45;
      }

      .evidence-block {
        margin-bottom: 20px;
      }

      .reference-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        margin: 0 0 10px;
      }

      .reference-item {
        min-width: 0;
        padding: 8px 9px;
        border: 1px solid var(--line);
        background: var(--paper-raised);
      }

      .reference-item dt {
        margin-bottom: 3px;
        color: var(--ink-soft);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .reference-item dd {
        margin: 0;
        overflow: hidden;
        font-size: 11px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ledger-summary {
        margin: 0 0 9px;
        color: var(--ink-soft);
        font-size: 11px;
        line-height: 1.45;
      }

      .ledger-list,
      .timeline-list,
      .detail-list,
      .risk-reason-list {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .ledger-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        padding: 8px 0;
        border-bottom: 1px dotted var(--line);
        font-size: 11px;
        line-height: 1.45;
      }

      .ledger-badge {
        min-width: 48px;
        padding: 2px 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink-soft);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 8px;
        font-weight: 800;
        text-align: center;
        text-transform: uppercase;
      }

      .ledger-title {
        display: block;
        color: var(--ink);
        font-weight: 750;
      }

      .ledger-meta {
        display: block;
        margin-top: 2px;
        color: var(--ink-soft);
        font-size: 10px;
      }

      .evidence-copy {
        min-width: 0;
      }

      .detail-list {
        gap: 2px;
        margin-top: 4px;
        color: var(--ink-soft);
        font-size: 10px;
      }

      .timeline-list {
        position: relative;
        gap: 0;
      }

      .timeline-item {
        position: relative;
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr);
        gap: 9px;
        padding: 0 0 12px;
        font-size: 11px;
        line-height: 1.45;
      }

      .timeline-item::after {
        position: absolute;
        top: 11px;
        bottom: 0;
        left: 5px;
        width: 1px;
        background: var(--line);
        content: "";
      }

      .timeline-item:last-child::after {
        display: none;
      }

      .timeline-dot {
        z-index: 1;
        width: 11px;
        height: 11px;
        margin-top: 2px;
        border: 2px solid var(--signal);
        border-radius: 50%;
        background: var(--paper);
      }

      .timeline-dot.is-failed {
        border-color: var(--danger);
      }

      .timeline-dot.is-warning,
      .evidence-dot.is-warning {
        border-color: var(--warn);
        background: var(--warn-wash);
        color: var(--warn);
      }

      .failure-panel {
        margin: 0 0 18px;
        padding: 11px 12px;
        border: 1px solid var(--danger);
        border-left-width: 4px;
        background: var(--danger-wash);
        font-size: 11px;
        line-height: 1.5;
      }

      .failure-panel strong {
        display: block;
        margin-bottom: 3px;
      }

      .audit-details {
        border: 1px solid var(--line);
        background: var(--paper-raised);
      }

      .audit-details summary {
        padding: 9px 10px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 760;
      }

      .audit-details summary:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .audit-details .ledger-list {
        padding: 0 10px 5px;
      }

      .risk-reason-list {
        gap: 4px;
        margin: -8px 0 18px;
        color: var(--ink-soft);
        font-size: 10px;
        line-height: 1.4;
      }

      .risk-reason-list li {
        position: relative;
        padding-left: 10px;
      }

      .risk-reason-list li::before {
        position: absolute;
        left: 0;
        color: var(--warn);
        content: "\2022";
      }

      .safety-grid {
        display: grid;
        gap: 8px;
        margin: 0 0 18px;
      }

      .safety-row {
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr);
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        line-height: 1.35;
      }

      .meta-label {
        color: var(--ink-soft);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .value-strong {
        font-weight: 780;
      }

      .is-warning {
        color: var(--warn);
      }

      .is-danger {
        color: var(--danger);
      }

      .notice {
        margin: 0 0 14px;
        padding: 10px 11px;
        border-left: 3px solid var(--signal);
        background: var(--signal-wash);
        color: var(--ink);
        font-size: 11px;
        line-height: 1.45;
      }

      .notice[data-tone="warning"] {
        border-color: var(--warn);
        background: var(--warn-wash);
      }

      .notice[data-tone="error"] {
        border-color: var(--danger);
        background: var(--danger-wash);
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      .action-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .action-button {
        min-height: 40px;
        padding: 9px 11px;
        border: 1px solid var(--ink);
        border-radius: 9px;
        background: var(--ink);
        color: var(--paper-raised);
        cursor: pointer;
        font-size: 11px;
        font-weight: 760;
        line-height: 1.25;
        text-align: left;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .action-button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 4px 0 var(--line);
      }

      .action-button:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: none;
      }

      .action-button.secondary {
        background: transparent;
        color: var(--ink);
      }

      .action-button.danger {
        border-color: var(--danger);
        background: transparent;
        color: var(--danger);
      }

      .action-button:disabled {
        border-color: var(--line);
        background: var(--muted);
        color: #777b77;
        cursor: not-allowed;
      }

      .action-button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .button-hint {
        display: block;
        margin-top: 3px;
        font-size: 9px;
        font-weight: 550;
        opacity: 0.78;
      }

      .receipt {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 14px;
        padding: 12px 22px 13px 26px;
        border-top: 1px dashed var(--line);
        background: var(--paper-raised);
        color: var(--ink-soft);
        font-size: 10px;
        line-height: 1.35;
      }

      .receipt-key {
        color: var(--ink);
        font-size: 9px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .skeleton {
        display: grid;
        min-height: 280px;
        place-items: center;
        padding: 28px;
        color: var(--ink-soft);
        text-align: center;
      }

      .skeleton strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
      }

      @media (max-width: 620px) {
        body {
          padding: 6px;
        }

        .shell {
          border-radius: 14px;
        }

        .masthead {
          padding: 17px 16px 15px 20px;
        }

        .manifest {
          grid-template-columns: 1fr;
        }

        .primary,
        .control {
          padding: 18px 16px 18px 20px;
        }

        .control {
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .rail-step {
          font-size: 9px;
        }

        .receipt {
          padding-right: 16px;
          padding-left: 20px;
        }
      }

      @media (max-width: 390px) {
        .kind-mark {
          display: none;
        }

        .rail-step span {
          display: none;
        }

        .action-pair {
          grid-template-columns: 1fr;
        }

        .reference-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ecece5;
          --ink-soft: #b5bab4;
          --paper: #202421;
          --paper-raised: #272c28;
          --line: #505650;
          --signal: #66c39f;
          --signal-wash: #26453a;
          --warn: #e8ad69;
          --warn-wash: #533b25;
          --danger: #f08c83;
          --danger-wash: #532f2c;
          --muted: #383d39;
          --focus: #74b8e8;
          --shadow: rgba(0, 0, 0, 0.28);
        }

        .action-button {
          border-color: var(--ink);
          background: var(--ink);
          color: #1a1d1b;
        }

        .action-button.secondary,
        .action-button.danger {
          background: transparent;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section class="shell skeleton" aria-busy="true">
        <div>
          <strong>운영 릴리스 정보를 기다리는 중입니다.</strong>
          GPT가 전달한 후보와 검증 증거가 도착하면 이곳에서 안전하게 이어서 처리합니다.
        </div>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const TOOL_BY_ACTION = Object.freeze({
          create: "create_release_branch",
          publish: "publish_release_candidate",
          claim: "assign_release_reviewer",
          approve: "submit_release_decision",
          reject: "submit_release_decision",
          execute: "execute_approved_release",
          deploy: "deploy_release",
          refresh: "get_release_status",
          rollback: "rollback_release",
          verify: "verify_release_completion",
        });

        const RISKY_ACTIONS = new Set(["create", "publish", "claim", "approve", "reject", "execute", "deploy", "rollback", "verify"]);
        const MCP_APPS_PROTOCOL_VERSION = "2026-01-26";
        // Web hosts can take several seconds to finish sandbox-proxy setup before
        // answering ui/initialize. Falling back after 750 ms can prevent the
        // required initialized notification from ever being sent, leaving the
        // iframe permanently hidden even though the tool call succeeded.
        const MCP_APPS_INITIALIZE_TIMEOUT_MS = 15000;
        const INITIAL_SNAPSHOT_POLL_INTERVAL_MS = 250;
        const INITIAL_SNAPSHOT_POLL_ATTEMPTS = 60;
        const WIDGET_RECOVERY_STATE_SCHEMA = "foundry-lite-governed-release-recovery/v1";
        const DEPLOYMENT_POLL_DELAYS_MS = Object.freeze([1000, 2000, 4000]);
        const DEPLOYMENT_POLL_STATUSES = new Set(["deploying", "deployment_unverified"]);
        const state = {
          snapshot: null,
          busyAction: "",
          message: "",
          tone: "info",
          lastRequestId: "",
          staleBlocked: false,
          permissionBlocked: false,
          recoveryPersistenceStatus: "not_attempted",
        };
        const pendingHostRequests = new Map();
        const deploymentPollWaiters = new Map();
        let nextHostRequestId = 1;
        let hostBridgeMode = "pending";
        let hostBridgeReadyPromise = null;
        let standardHostTarget = null;
        let isHostBridgeTornDown = false;
        let initialSnapshotPollGeneration = 0;
        let initialSnapshotPollTimerId;
        let hasAttemptedInitialSnapshotRecovery = false;
        let lastPersistedRecoveryCoordinate = "";
        let pollingGeneration = 0;
        let activePollingPromise = null;

        const app = document.getElementById("app");

        function isObject(value) {
          return value !== null && typeof value === "object" && !Array.isArray(value);
        }

        function firstValue(...values) {
          return values.find((value) => value !== undefined && value !== null && value !== "");
        }

        function asArray(value) {
          if (Array.isArray(value)) return value;
          if (value === undefined || value === null || value === "") return [];
          return [value];
        }

        function asBoolean(value) {
          if (typeof value === "boolean") return value;
          if (typeof value === "string") return ["true", "yes", "required", "stale"].includes(value.toLowerCase());
          return Boolean(value);
        }

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function compactObject(value) {
          return Object.fromEntries(Object.entries(value).filter(([, item]) => item !== undefined && item !== null && item !== ""));
        }

        function safeText(value) {
          return ["string", "number", "boolean"].includes(typeof value) ? String(value) : "";
        }

        function safeTextItems(value) {
          return asArray(value).map(safeText).filter(Boolean);
        }

        function structuredContentFrom(value) {
          if (!isObject(value)) return null;
          if (isObject(value.structuredContent)) return value.structuredContent;
          if (isObject(value.toolOutput)) return structuredContentFrom(value.toolOutput) || value.toolOutput;
          return value;
        }

        function normalizeKind(value) {
          const kind = String(value || "unknown").toLowerCase();
          if (kind.includes("ontology")) return "ontology";
          if (kind.includes("pipeline")) return "pipeline";
          return kind;
        }

        function normalizeEvidenceItem(item, index, fallbackLabel = "검증 증거") {
          if (typeof item === "string") {
            return { id: `evidence-${index}`, label: item, status: "passed", proofKind: "", details: [] };
          }
          if (typeof item === "boolean") {
            return {
              id: `evidence-${index}`,
              label: fallbackLabel,
              status: item ? "passed" : "failed",
              proofKind: "",
              details: [],
            };
          }
          const entry = isObject(item) ? item : {};
          const label = safeText(firstValue(entry.label, entry.name, entry.summary, entry.description));
          const status = safeText(
            firstValue(entry.status, entry.result, entry.state, entry.passed === false ? "failed" : "passed"),
          );
          return {
            id: safeText(firstValue(entry.id, entry.evidenceId)) || `evidence-${index}`,
            label: label || fallbackLabel,
            status: (status || "passed").toLowerCase(),
            proofKind: safeText(entry.proofKind),
            details: validationDetailItems(entry.details),
          };
        }

        function validationDetailItems(value) {
          const details = isObject(value) ? value : {};
          const checks = safeTextItems(details.evaluatedChecks);
          const entries = [
            ["검증 수", details.testCount],
            ["선언 테스트", details.declaredTestCount],
            ["실패 수", details.failureCount],
            ["객체 타입", details.objectTypeCount],
            ["링크 타입", details.linkTypeCount],
            ["액션 타입", details.actionTypeCount],
            ["차단 변경", details.blockedCount],
            ["경고", details.warningCount],
            ["재색인", details.reindexCount],
            ["현재 그래프", details.isCurrentGraph],
            ["데이터 실행", details.isDataExecution],
            ["마이그레이션", details.status],
            ["소비자 호환성", details.consumerCompatibility],
            ["SDK 호환성", details.sdkCompatibility],
            ["증거 버전", details.proofVersion],
            ["사유", details.reason],
            ["검사 항목", checks.length ? checks.join(", ") : undefined],
          ];
          return entries
            .filter(([, item]) => ["string", "number", "boolean"].includes(typeof item))

            h4 = h1 ^ Math.imul(h4 ^ code, 2716044179);

            empty_inbox: "검토함 비어 있음",
            validated: "검증 완료",
            awaiting_review: "사람 검토 대기",
            awaiting_approval: "승인 대기",
            pending_approval: "승인 대기",
            approved: "승인 완료",
            rejected: "반려됨",
            executed: "내부 브랜치 반영 완료",
            merged: "내부 브랜치 병합 완료",
            activated: "활성화 완료",
            ready_to_deploy: "배포 준비 완료",
            ready: "배포 준비",
            promoted: "Pipeline PROMOTED",
            deployed: "Pipeline PROMOTED",
            deploying: "외부 운영 배포 진행 중",
            deployment_unverified: "외부 운영 배포 확인 필요",
            deployment_failed: "외부 운영 배포 실패",
            active: "운영 활성",
            running: "운영 실행 중",
            succeeded: "운영 정상",
            failed: "운영 실패",
            rollback_pending: "롤백 진행 중",
            rolled_back: "롤백 완료",
            superseded: "현재 운영판에서 교체됨",
            stale: "후보 변경 감지",
          };
          return labels[status] || status.replaceAll("_", " ");
        }

        function riskLabel(level) {
          return { low: "낮음", medium: "중간", high: "높음", critical: "매우 높음", unclassified: "미분류" }[level] || level;
        }

        function hasStatusTarget(snapshot) {
          if (!snapshot) return false;
          if (!realProposalId(snapshot.proposalId)) return false;
          return !["workspace_ready", "branch_created", "empty_inbox"].includes(snapshot.status);
        }

        function inferredActionAllowed(action, snapshot) {
          const status = snapshot.status;
          if (action === "refresh") return hasStatusTarget(snapshot);
          if (action === "create") return status === "workspace_ready";
          if (action === "claim") return status === "awaiting_assignment" && snapshot.canCurrentUserClaim;
          if (action === "approve" || action === "reject") return ["validated", "awaiting_review", "awaiting_approval", "pending_approval", "proposed"].includes(status);
          if (action === "execute") return status === "approved";
          if (action === "deploy") return snapshot.kind === "pipeline" && ["executed", "merged", "activated", "ready_to_deploy"].includes(status);
          if (action === "rollback") return ["activated", "active", "promoted", "deployed", "running", "succeeded", "failed"].includes(status);
          if (action === "verify") return Boolean(snapshot.completionCoordinates);
          return false;
        }

        function permissionAllows(action, snapshot) {
          const key = `can${action[0].toUpperCase()}${action.slice(1)}`;
          const value = snapshot.permissions[key];
          return value === undefined ? true : Boolean(value);
        }

        function actionAllowed(action, snapshot) {
          if (action === "refresh") return !state.busyAction && hasStatusTarget(snapshot);
          if (state.busyAction || state.staleBlocked || state.permissionBlocked || snapshot.isStale) return false;
          if (action === "create" && !snapshot.branchName) return false;
          if (action === "claim" && !snapshot.canCurrentUserClaim) return false;
          if (["approve", "reject"].includes(action) && snapshot.requiresAssignment && !snapshot.reviewerAssigned) return false;
          if (["approve", "reject"].includes(action) && snapshot.canCurrentUserReview === false) return false;
          if (snapshot.kind === "ontology" && ["approve", "reject", "execute"].includes(action) && !snapshot.fingerprint) return false;
          if (action === "deploy" && (snapshot.kind !== "pipeline" || !snapshot.pipelineId || !snapshot.mergedVersionId)) return false;
          if (action === "rollback" && !snapshot.rollbackTarget) return false;
          if (action === "verify" && !snapshot.completionCoordinates) return false;
          if (!permissionAllows(action, snapshot)) return false;
          if (action === "verify") return true;
          if (snapshot.allowedActions) return snapshot.allowedActions.has(action);
          return inferredActionAllowed(action, snapshot);
        }

        function actionDisabledReason(action, snapshot) {
          if (state.busyAction) return `${state.busyAction} 요청 처리 중`;
          if (action === "refresh" && !hasStatusTarget(snapshot)) return "서버 조회 가능한 릴리스 제안이 아직 없음";
          if (state.permissionBlocked) return "현재 사용자 권한으로 실행할 수 없음";
          if (state.staleBlocked || snapshot.isStale) return "후보가 변경됨 — 상태 새로고침 필요";
          if (!permissionAllows(action, snapshot)) return "현재 역할에 필요한 권한이 없음";
          if (action === "create" && !snapshot.branchName) return "생성할 브랜치 이름이 없음";
          if (action === "claim" && !snapshot.canCurrentUserClaim) return "이 제안은 현재 사용자가 담당할 수 없음";
          if (["approve", "reject"].includes(action) && snapshot.requiresAssignment && !snapshot.reviewerAssigned) return "사람 검토자가 아직 배정되지 않음";
          if (["approve", "reject"].includes(action) && snapshot.canCurrentUserReview === false) return "배정된 사람 검토자만 결정할 수 있음";
          if (snapshot.kind === "ontology" && ["approve", "reject", "execute"].includes(action) && !snapshot.fingerprint) return "Ontology fingerprint 증거가 아직 없음";
          if (action === "deploy" && snapshot.kind !== "pipeline") return "Pipeline 후보에서만 PROMOTED 배포 가능";
          if (action === "deploy" && (!snapshot.pipelineId || !snapshot.mergedVersionId)) return "병합된 Pipeline 버전 증거가 아직 없음";
          if (action === "rollback" && !snapshot.rollbackTarget) return "서버가 검증한 롤백 대상이 아직 없음";
          if (action === "verify" && !snapshot.completionCoordinates) return "서버가 제공한 배포·롤백 리허설 좌표가 아직 없음";
          return "현재 릴리스 단계에서는 실행할 수 없음";
        }

        function evidenceTone(status) {
          if (["failed", "blocked", "error", "missing", "not_available", "outcome_unknown"].includes(status)) {
            return { className: "is-failed", symbol: "!" };
          }
          if (["warning", "pending", "running"].includes(status)) {
            return { className: "is-warning", symbol: "\u2022" };
          }
          return { className: "", symbol: "\u2713" };
        }

        function countSummary(diff) {
          const labels = [
            ["총", diff.counts.total],
            ["추가", diff.counts.added],
            ["변경", diff.counts.modified],
            ["제거", diff.counts.removed],
            ["차단", diff.counts.blocked],
            ["경고", diff.counts.warnings],
          ];
          const parts = labels.filter(([, value]) => value !== null).map(([label, value]) => `${label} ${value}건`);
          return parts.join(" \u00b7 ") || (diff.changed ? "변경 항목이 있습니다." : "변경 건수 정보가 없습니다.");
        }

        function referenceGridMarkup(diff) {
          const refs = [
            ["기준", diff.baseRef],
            ["후보", diff.candidateRef],
          ].filter(([, value]) => value);
          if (!refs.length) return "";
          return `<dl class="reference-grid">${refs.map(([label, value]) => `<div class="reference-item">
            <dt>${escapeHtml(label)}</dt><dd class="mono" title="${escapeHtml(value)}">${escapeHtml(value)}</dd>
          </div>`).join("")}</dl>`;
        }

        function changeDiffMarkup(snapshot) {
          const diff = snapshot.changeDiff;
          if (!diff.isProvided) {
            return '<p class="empty-copy">서버가 변경 Diff를 제공하지 않았습니다. 승인 전에 후보를 다시 확인하세요.</p>';
          }
          const items = diff.items.length
            ? `<ul class="ledger-list" aria-label="변경 Diff 항목">${diff.items.map((item) => {
              const title = item.summary || [item.resourceType, item.resourceId].filter(Boolean).join(" ") || "변경 항목";
              const meta = [item.resourceType, item.resourceId].filter(Boolean).join(" \u00b7 ");
              return `<li class="ledger-item"><span class="ledger-badge">${escapeHtml(changeTypeLabel(item.changeType))}</span>
                <span><span class="ledger-title">${escapeHtml(title)}</span>${meta ? `<span class="ledger-meta">${escapeHtml(meta)}</span>` : ""}</span>
              </li>`;
            }).join("")}</ul>`
            : '<p class="empty-copy">서버 Diff 기준으로 변경 항목이 없습니다.</p>';
          return `${referenceGridMarkup(diff)}<p class="ledger-summary">${escapeHtml(countSummary(diff))}</p>${items}`;
        }

        function changeTypeLabel(value) {
          return { added: "추가", modified: "변경", removed: "제거" }[value] || value || "변경";
        }

        function impactMarkup(snapshot) {
          const scope = snapshot.impactScope;
          if (!scope.isProvided) {
            return '<p class="empty-copy">서버가 영향 범위를 제공하지 않았습니다. 승인 전에 범위를 다시 확인하세요.</p>';
          }
          const summary = scope.summary ? `<p class="ledger-summary">${escapeHtml(scope.summary)}</p>` : "";
          if (!scope.resources.length) return `${summary}<p class="empty-copy">영향을 받는 운영 리소스가 없습니다.</p>`;
          return `${summary}<ul class="ledger-list" aria-label="영향받는 운영 리소스">${scope.resources.map((item) => {
            const title = item.label || item.resourceId || "운영 리소스";
            const meta = [item.type, item.resourceId].filter(Boolean).join(" \u00b7 ");
            return `<li class="ledger-item"><span class="ledger-badge">${escapeHtml(item.impact || "영향")}</span>
              <span><span class="ledger-title">${escapeHtml(title)}</span>${meta ? `<span class="ledger-meta">${escapeHtml(meta)}</span>` : ""}</span>
            </li>`;
          }).join("")}</ul>`;
        }

        function riskReasonsMarkup(snapshot) {
          const risk = snapshot.riskClassification;
          const reasons = [...risk.reasons];
          if (risk.missingEvidence.length) reasons.push(`미확보 증거: ${risk.missingEvidence.join(", ")}`);
          if (!reasons.length) reasons.push("위험 분류 사유가 제공되지 않았습니다.");
          return `<ul class="risk-reason-list" aria-label="위험 분류 사유">${reasons
            .map((reason) => `<li>${escapeHtml(reason)}</li>`)
            .join("")}</ul>`;
        }

        function timelineMarkup(snapshot) {
          if (!snapshot.executionTimeline.length) {
            return '<p class="empty-copy">기록된 실행 이벤트가 없습니다.</p>';
          }
          return `<ol class="timeline-list" aria-label="릴리스 실행 타임라인">${snapshot.executionTimeline.map((item) => {
            const tone = evidenceTone(item.status);
            const meta = [item.actorDisplayName, item.requestId ? `Request ${item.requestId}` : ""].filter(Boolean).join(" \u00b7 ");
            const time = item.at ? `<time datetime="${escapeHtml(item.at)}">${escapeHtml(item.at)}</time>` : "시간 미제공";
            return `<li class="timeline-item"><span class="timeline-dot ${tone.className}" aria-hidden="true"></span>
              <span><span class="ledger-title">${escapeHtml(item.label)}</span>
                <span class="ledger-meta">${time}${meta ? ` \u00b7 ${escapeHtml(meta)}` : ""} \u00b7 ${escapeHtml(item.status)}</span>
              </span>
            </li>`;
          }).join("")}</ol>`;
        }

        function failureMarkup(snapshot) {
          const failure = snapshot.failureDetails;
          if (!failure) return '<p class="empty-copy">현재 미해결 실패 증거가 없습니다.</p>';
          const title = failure.code || "release_action_failed";
          const meta = [
            failure.stage,
            failure.at,
            failure.requestId ? `Request ${failure.requestId}` : "",
            failure.isRetryable ? "안전 재시도 가능" : "자동 재시도 금지",
            failure.knownNotCommitted ? "미커밋 확인됨" : "커밋 여부 확인 필요",
          ].filter(Boolean).join(" \u00b7 ");
          return `<div class="failure-panel" role="alert" aria-label="릴리스 실패 상세">
            <strong>${escapeHtml(title)}</strong>
            <span>${escapeHtml(failure.message || "운영 릴리스 작업이 성공으로 확인되지 않았습니다.")}</span>
            ${meta ? `<span class="ledger-meta">${escapeHtml(meta)}</span>` : ""}
          </div>`;
        }

        function auditMarkup(snapshot) {
          if (!snapshot.auditEvidence.length) {
            return '<p class="empty-copy">조회된 감사 이벤트가 없습니다.</p>';
          }
          return `<details class="audit-details"><summary>감사 증거 ${snapshot.auditEvidence.length}건 보기</summary>
            <ul class="ledger-list" aria-label="릴리스 감사 증거">${snapshot.auditEvidence.map((item) => {
              const resource = [item.resourceType, item.resourceId].filter(Boolean).join(":");
              const meta = [item.at, item.actorUserId, resource, item.requestId ? `Request ${item.requestId}` : ""].filter(Boolean).join(" \u00b7 ");
              return `<li class="ledger-item"><span class="ledger-badge">${escapeHtml(item.status)}</span>
                <span><span class="ledger-title">${escapeHtml(item.label)}</span>${meta ? `<span class="ledger-meta">${escapeHtml(meta)}</span>` : ""}</span>
              </li>`;
            }).join("")}</ul>
          </details>`;
        }

        function evidenceMarkup(snapshot) {
          if (!snapshot.evidence.length) {
            return '<p class="empty-copy">서버가 검증 증거를 제공하지 않았습니다. 위험 작업을 진행하기 전에 상태를 새로고침하세요.</p>';
          }
          return `<ul class="evidence-list">${snapshot.evidence
            .map((item) => {
              const tone = evidenceTone(item.status);
              return `<li class="evidence-item">
                <span class="evidence-dot ${tone.className}" aria-hidden="true">${tone.symbol}</span>
                <span class="evidence-copy"><span class="ledger-title">${escapeHtml(item.label)}</span>
                  ${item.proofKind ? `<span class="ledger-meta">Proof: ${escapeHtml(item.proofKind)}</span>` : ""}
                  ${item.details.length ? `<ul class="detail-list">${item.details.map((detail) => `<li>${escapeHtml(detail)}</li>`).join("")}</ul>` : ""}
                </span>
                <span class="evidence-state">${escapeHtml(item.status)}</span>
              </li>`;
            })
            .join("")}</ul>`;
        }

        function liveReadinessMarkup(snapshot) {
          const readiness = snapshot.liveReadiness;
          const labels = {
            blocked: "호스티드 배포·복구 리허설 증거 차단",
            ready_for_live_run: "호스티드 배포·복구 리허설 준비 · 아직 미검증",
            live_verified: "호스티드 배포·복구 리허설 검증됨",
          };
          const tone = readiness.status === "live_verified"
            ? ""
            : readiness.status === "ready_for_live_run" ? "is-warning" : "is-danger";
          const blockers = readiness.blockers.length
            ? `<ul class="detail-list" aria-label="호스티드 배포·복구 리허설 차단 사유">${readiness.blockers
              .map((blocker) => `<li>${escapeHtml(blocker)}</li>`)
              .join("")}</ul>`
            : "";
          const attestation = readiness.attestation;
          const attestationMeta = attestation
            ? [
              attestation.attestationId ? `영수증 ${attestation.attestationId}` : "",
              attestation.collectorVersion ? `Collector ${attestation.collectorVersion}` : "",
              attestation.collectedAt ? `수집 ${attestation.collectedAt}` : "",
              attestation.validUntil ? `유효 ${attestation.validUntil}` : "",
            ].filter(Boolean).join(" · ")
            : "";
          const attestationReceipt = attestationMeta
            ? `<p class="ledger-meta" aria-label="배포·복구 리허설 검증 영수증">${escapeHtml(attestationMeta)}</p>`
            : readiness.status === "live_verified"
              ? '<p class="ledger-meta is-warning">검증 상태는 있으나 리허설 영수증 요약이 제공되지 않았습니다.</p>'
              : "";
          return `<div class="safety-row"><span class="meta-label">배포·복구 리허설</span>
            <span class="value-strong ${tone}">${escapeHtml(labels[readiness.status])}</span></div>${attestationReceipt}${blockers}`;
        }

        function operationalCompletionMarkup(snapshot) {
          const completion = snapshot.operationalCompletion;
          const label = completion.isServerProvided
            ? completion.isComplete
              ? "현재 릴리스 정상 운영 완료"
              : `현재 릴리스 운영 미완료 · ${statusLabel(completion.stage || snapshot.status)}`
            : "현재 릴리스 운영 완료 판정 미제공";
          const tone = completion.isComplete ? "" : "is-warning";
          return `<div class="safety-row"><span class="meta-label">현재 릴리스</span>
            <span class="value-strong ${tone}">${escapeHtml(label)}</span></div>`;
        }

        function railMarkup(snapshot) {
          const current = statusStep(snapshot);
          const stepLabels = snapshot.kind === "pipeline"
            ? ["제안", "검증", "승인", "내부 병합", "PROMOTED · 외부 배포"]
            : ["제안", "검증", "승인", "병합·활성화", "운영 적용"];
          if (snapshot.status === "superseded") {
            stepLabels[4] = "운영판 교체 완료 · 롤백/후속 배포";
          }
          return `<ol class="rail" aria-label="릴리스 진행 단계">${stepLabels.map((label, index) => {
            const className = index < current ? "is-done" : index === current ? "is-current" : "";
            const currentAttribute = index === current ? ' aria-current="step"' : "";
            return `<li class="rail-step ${className}"${currentAttribute}><span>${escapeHtml(label)}</span></li>`;
          }).join("")}</ol>`;
        }

        function buttonMarkup(action, label, hint, className = "") {
          const snapshot = state.snapshot;
          const isAllowed = actionAllowed(action, snapshot);
          const isBusy = state.busyAction === action;
          const disabledReason = isAllowed ? "" : actionDisabledReason(action, snapshot);
          return `<button
            type="button"
            class="action-button ${className}"
            data-action="${escapeHtml(action)}"
            ${isAllowed ? "" : "disabled"}
            aria-label="${escapeHtml(isBusy ? `${label} 처리 중` : label)}"
            title="${escapeHtml(disabledReason)}"
          >${escapeHtml(isBusy ? "처리 중…" : label)}<span class="button-hint">${escapeHtml(hint)}</span></button>`;
        }

        function renderEmpty() {
          const hasMessage = Boolean(state.message);
          app.innerHTML = `<section class="shell skeleton" aria-busy="${hasMessage ? "false" : "true"}"><div>
            <strong>${hasMessage ? "릴리스 상태 복구 안내" : "운영 릴리스 정보를 기다리는 중입니다."}</strong>
            ${escapeHtml(state.message || "GPT가 전달한 후보와 검증 증거가 도착하면 이곳에서 안전하게 이어서 처리합니다.")}
          </div></section>`;
        }

        function render() {
          const snapshot = state.snapshot;
          if (!snapshot) return renderEmpty();
          const executeLabel = snapshot.kind === "ontology" ? "병합 · 활성화 실행" : "내부 브랜치 병합 실행";
          const executeHint = snapshot.kind === "ontology" ? "승인된 Ontology 후보만 활성화" : "승인된 Pipeline 후보만 반영";
          const riskClass = ["high", "critical"].includes(snapshot.riskLevel) ? "is-danger" : snapshot.riskLevel === "medium" ? "is-warning" : "";
          const staleCopy = state.staleBlocked || snapshot.isStale
            ? "변경 감지 — 새로고침 필요"
            : snapshot.hasFreshnessSignal
              ? "최신 후보와 일치"
              : "서버 스냅샷 기준 · freshness 미제공";
          const notice = state.message
            ? `<div class="notice" data-tone="${escapeHtml(state.tone)}" role="status">${escapeHtml(state.message)}</div>`
            : "";
          const kindLabel = snapshot.kind === "ontology" ? "Ontology" : snapshot.kind === "pipeline" ? "Pipeline" : snapshot.kind;
          const reviewCopy = snapshot.requiresAssignment
            ? snapshot.separateReviewerRequired
              ? `필수 · ${snapshot.reviewer === "미지정" ? "별도 검토자 배정 필요" : `${snapshot.reviewer} 별도 검토`}`
              : `필수 · ${snapshot.reviewer === "미지정" ? "사람 검토자 배정 필요" : `${snapshot.reviewer} 검토 (작성자 허용)`}`
            : "검토 담당 배정 불필요";
          const statusEvidence = snapshot.hasStatusEvidence
            ? `<div class="evidence-block"><h2 class="section-label">실행 타임라인</h2>${timelineMarkup(snapshot)}</div>
              <div class="evidence-block"><h2 class="section-label">실패 상세</h2>${failureMarkup(snapshot)}</div>
              <div class="evidence-block"><h2 class="section-label">감사 증거</h2>${auditMarkup(snapshot)}</div>`
            : "";
          const riskCompleteness = snapshot.riskClassification.isComplete === null
            ? "미제공"
            : snapshot.riskClassification.isComplete ? "완결" : "미완결";
          app.innerHTML = `<section class="shell" aria-busy="${state.busyAction ? "true" : "false"}">
            <header class="masthead">
              <div>
                <p class="eyebrow">GPT governed release</p>
                <h1>${escapeHtml(snapshot.name)}</h1>
              </div>
              <span class="kind-mark">${escapeHtml(kindLabel)}</span>
            </header>
            <div class="manifest">

                state.lastRequestId = state.snapshot.requestId || state.lastRequestId;
                if (!DEPLOYMENT_POLL_STATUSES.has(state.snapshot.status)) {
                  state.message = "외부 운영 배포 상태를 서버 기준으로 자동 확인했습니다.";
                  state.tone = "info";
                  render();
                  return true;
                }
                render();
              } catch (error) {
                state.message = `외부 운영 배포 자동 확인을 멈췄습니다. 상태 새로고침으로 다시 확인하세요. (${String(error.message || error)})`;
                state.tone = "warning";
                render();
                return false;
              }
            }
            if (generation === pollingGeneration && DEPLOYMENT_POLL_STATUSES.has(state.snapshot.status)) {
              state.message = "외부 운영 배포를 3회 자동 확인했지만 아직 완료되지 않았습니다. 잠시 후 상태를 새로고침하세요.";
              state.tone = "warning";
              render();
            }
            return false;
          })();
          activePollingPromise = polling;
          try {
            return await polling;
          } finally {
            if (activePollingPromise === polling) activePollingPromise = null;
          }
        }

        async function resumeRiskyAction(toolName, args, confirmedArgs, initialError) {
          let lastError = initialError;
          let retryArgs = confirmedArgs;
          for (let attempt = 0; attempt < 3; attempt += 1) {
            try {
              return await callTool(toolName, retryArgs);
            } catch (error) {
              lastError = error;
              if (retryArgs !== args) {
                retryArgs.widgetConfirmationToken = "";
                retryArgs = args;
              }
              const delay = recoveryDelayMs(error);
              if (delay === null) throw initialError;
              state.message = "서버에서 진행 중인 동일 작업을 중복 실행 없이 자동 확인하고 있습니다.";
              state.tone = "warning";
              render();
              await waitForRecovery(delay);
            }
          }
          throw lastError;
        }

        async function prepareRiskyAction(toolName, args) {
          const prepareInput = { targetTool: toolName, arguments: args };
          try {
            return await callTool("prepare_release_action", prepareInput);
          } catch (_firstError) {
            state.message = "확인 카드 응답을 받지 못해 같은 준비 요청을 안전하게 한 번 복구하고 있습니다.";
            state.tone = "warning";
            render();
            return callTool("prepare_release_action", prepareInput);
          }
        }

        async function invokeRiskyAction(toolName, args) {
          let confirmationToken = "";
          let confirmedArgs;
          try {
            const prepared = await prepareRiskyAction(toolName, args);
            confirmationToken = widgetConfirmationToken(prepared);
            if (!confirmationToken) throw new Error("서버 확인 토큰이 없어 위험 작업을 실행하지 않았습니다.");
            confirmedArgs = { ...args, widgetConfirmationToken: confirmationToken };
            try {
              return await callTool(toolName, confirmedArgs);
            } catch (error) {
              if (hasServerErrorEvidence(error) && recoveryDelayMs(error) === null) throw error;
              state.message = "응답이 끊긴 작업의 완료 여부를 같은 작업 키로 확인하고 있습니다.";
              state.tone = "warning";
              render();
              return await resumeRiskyAction(toolName, args, confirmedArgs, error);
            }
          } finally {
            confirmationToken = "";
            if (confirmedArgs) confirmedArgs.widgetConfirmationToken = "";
            confirmedArgs = undefined;
          }
        }

        async function sendBuilderHandoff(snapshot) {
          if (!snapshot.builderWorkspaceRef) return "unavailable";
          const mode = snapshot.kind === "ontology" ? "ontology_editing" : "data_integration";
          const prompt = [
            "격리 브랜치가 준비되었습니다. Builder MCP로 편집, 검증, 테스트, 제안 제출을 계속해 주세요.",
            `mode: ${mode}`,
            `workspaceRef: ${snapshot.builderWorkspaceRef}`,
            "쓰기 작업은 이 대화의 Builder 확인 카드에서 제가 직접 승인할 때만 실행하세요.",
          ].join("\n");
          try {
            const bridgeMode = await hostBridgeReady();
            if (bridgeMode === "standard") {
              await standardHostRequest("ui/message", {
                role: "user",
                content: [{ type: "text", text: prompt }],
              });
            } else if (bridgeMode === "alias" && typeof globalThis.openai.sendFollowUpMessage === "function") {
              await globalThis.openai.sendFollowUpMessage({ prompt, scrollToBottom: true });
            } else {
              return "unavailable";
            }
            return "sent";
          } catch (_error) {
            return "failed";
          }
        }

        async function invokeAction(action) {
          if (!TOOL_BY_ACTION[action] || state.busyAction || !state.snapshot) return;
          if (!actionAllowed(action, state.snapshot)) return;
          cancelDeploymentPolling();
          const snapshotBeforeAction = state.snapshot;
          state.busyAction = action;
          state.message = `${action === "refresh" ? "운영 상태" : "보호된 작업"}을 확인하고 있습니다.`;
          state.tone = "info";
          render();
          try {
            const args = actionArgs(action);
            const toolName = TOOL_BY_ACTION[action];
            const result = RISKY_ACTIONS.has(action)
              ? await invokeRiskyAction(toolName, args)
              : await callTool(toolName, args);
            let hasSnapshot = replaceAuthoritativeSnapshot(result);
            let refreshError = null;
            if (!hasSnapshot && action !== "refresh") {
              try {
                const refreshed = await callTool("get_release_status", statusArgs(snapshotBeforeAction));
                hasSnapshot = replaceAuthoritativeSnapshot(refreshed);
              } catch (error) {
                refreshError = error;
              }
            }
            if (action === "refresh" && hasSnapshot) {
              state.staleBlocked = false;
              state.permissionBlocked = false;
            }
            const handoff = action === "create" && hasSnapshot
              ? await sendBuilderHandoff(state.snapshot)
              : "not-needed";
            state.message = handoff === "sent"
              ? "격리 브랜치를 만들고 Builder 작업 지시를 이 대화에 전달했습니다."
              : handoff === "failed" || handoff === "unavailable"
                ? `격리 브랜치는 만들어졌습니다. Builder 연결 인계가 자동으로 전달되지 않았으므로 Workspace ${state.snapshot.builderWorkspaceRef}에서 계속하세요.`
                : hasSnapshot
                  ? "서버가 반환한 최신 운영 스냅샷으로 갱신했습니다."
              : refreshError
                ? `작업 호출은 완료됐지만 운영 상태 확인에 실패해 기존 상태를 유지합니다. (${String(refreshError.message || refreshError)})`
                : "요청은 끝났지만 전체 운영 스냅샷이 없어 기존 상태를 유지합니다. 상태를 새로고침하세요.";
            state.tone = hasSnapshot && !["failed", "unavailable"].includes(handoff) ? "info" : "warning";
            if (hasSnapshot && DEPLOYMENT_POLL_STATUSES.has(state.snapshot.status)) {
              await pollDeploymentStatus();
            }
          } catch (error) {
            state.message = classifyFailure(error);
            state.tone = "error";
          } finally {
            state.busyAction = "";
            render();
          }
        }

        function receiveToolOutput(value) {
          if (isHostBridgeTornDown) return false;
          const normalized = normalizeSnapshot(value);
          if (!normalized) return false;
          cancelInitialSnapshotPolling();
          cancelDeploymentPolling();
          state.snapshot = normalized;
          void persistRecoveryCoordinate(normalized);
          state.lastRequestId = normalized.requestId || state.lastRequestId;
          state.staleBlocked = normalized.isStale;
          state.permissionBlocked = false;
          state.message = "";
          state.tone = "info";
          render();
          if (DEPLOYMENT_POLL_STATUSES.has(normalized.status)) void pollDeploymentStatus();
          return true;
        }

        globalThis.addEventListener("message", handleStandardHostMessage);

        globalThis.addEventListener("openai:set_globals", (event) => {
          const detail = event && event.detail;
          const globals = isObject(detail && detail.globals) ? detail.globals : detail;
          if (isObject(globals) && Object.prototype.hasOwnProperty.call(globals, "toolOutput")) {
            if (!receiveToolOutput(globals.toolOutput)) startInitialSnapshotPolling();
          } else if (isObject(globalThis.openai) && !state.snapshot) {
            if (
              isObject(globals)
                && (
                  Object.prototype.hasOwnProperty.call(globals, "widgetState")
                    || Object.prototype.hasOwnProperty.call(globals, "toolInput")
                )
            ) hasAttemptedInitialSnapshotRecovery = false;
            startInitialSnapshotPolling();
          }
        });

        if (globalThis.openai && Object.prototype.hasOwnProperty.call(globalThis.openai, "toolOutput")) {
          if (!receiveToolOutput(globalThis.openai.toolOutput)) {
            render();
            startInitialSnapshotPolling();
          }
        } else {
          render();
          startInitialSnapshotPolling();
        }
        void hostBridgeReady();

        globalThis.__foundryReleaseWidgetTest = Object.freeze({
          invokeAction,
          normalizeSnapshot,
          receiveToolOutput,
          recoverInitialSnapshotFromReadTool,
          getBridgeMode: () => hostBridgeMode,
          waitForPolling: () => activePollingPromise || Promise.resolve(false),
          getState: () => ({
            snapshot: state.snapshot ? { ...state.snapshot } : null,
            busyAction: state.busyAction,
            staleBlocked: state.staleBlocked,
            permissionBlocked: state.permissionBlocked,
            lastRequestId: state.lastRequestId,
            message: state.message,
            tone: state.tone,
            recoveryPersistenceStatus: state.recoveryPersistenceStatus,
          }),
        });
      })();
    </script>
  </body>
</html>
