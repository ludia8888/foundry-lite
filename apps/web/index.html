<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry-lite Operations</title>
    <style>
      :root {
        --ink: #18201d;
        --muted: #68736e;
        --line: #d7ddd7;
        --paper: #f7f8f4;
        --panel: #ffffff;
        --field: #eef2ed;
        --accent: #0f766e;
        --accent-2: #b12f2f;
        --ok: #127047;
        --warn: #9b6115;
        --shadow: 0 18px 45px rgba(24, 32, 29, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(24, 32, 29, 0.055) 1px, transparent 1px),
          linear-gradient(rgba(24, 32, 29, 0.04) 1px, transparent 1px), var(--paper);
        background-size: 28px 28px;
        color: var(--ink);
        font-family:
          "Avenir Next",
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        padding: 24px;
      }

      .topbar {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 18px;
        justify-content: space-between;
        padding-bottom: 18px;
      }

      .brand {
        display: grid;
        gap: 3px;
      }

      .brand strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .brand span,
      .status-line {
        color: var(--muted);
        font-size: 13px;
      }

      .status-line {
        align-items: center;
        display: flex;
        gap: 9px;
      }

      .dot {
        background: var(--warn);
        border-radius: 999px;
        display: inline-block;
        height: 10px;
        width: 10px;
      }

      .dot.ok {
        background: var(--ok);
      }

      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        margin-top: 20px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .panel header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        padding: 14px 16px;
      }

      .panel h2 {
        font-size: 14px;
        letter-spacing: 0;
        margin: 0;
        text-transform: uppercase;
      }

      .panel-body {
        padding: 16px;
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      label {
        color: var(--muted);
        display: grid;
        font-size: 12px;
        gap: 6px;
      }

      input,
      select,
      textarea {
        background: var(--field);
        border: 1px solid transparent;
        color: var(--ink);
        min-height: 40px;
        outline: none;
        padding: 10px 11px;
        width: 100%;
      }

      textarea {
        min-height: 82px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        background: #fff;
      }

      .row {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 1fr;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        align-items: center;
        background: var(--ink);
        border: 0;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        gap: 8px;
        min-height: 38px;
        padding: 9px 13px;
      }

      button.secondary {
        background: #dfe7df;
        color: var(--ink);
      }

      button.danger {
        background: var(--accent-2);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .result {
        background: #111815;
        color: #dcefe5;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        line-height: 1.55;
        min-height: 270px;
        overflow: auto;
        padding: 16px;
        white-space: pre-wrap;
      }

      .result.compact {
        min-height: 160px;
      }

      .object-card {
        border: 1px solid var(--line);
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .metric-strip {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .metric {
        background: #eef2ed;
        border-left: 4px solid var(--accent);
        min-height: 74px;
        padding: 12px;
      }

      .metric span {
        color: var(--muted);
        display: block;
        font-size: 12px;
      }

      .metric strong {
        display: block;
        font-size: 20px;
        margin-top: 8px;
      }

      @media (max-width: 860px) {
        .shell {
          padding: 16px;
        }

        .topbar,
        .grid,
        .row,
        .metric-strip {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brand">
          <strong>Foundry-lite</strong>
          <span>Operational object loop</span>
        </div>
        <div class="status-line">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">API unknown</span>
        </div>
      </section>

      <section class="grid">
        <aside class="panel">
          <header>
            <h2>Control</h2>
          </header>
          <div class="panel-body stack">
            <label>
              API Base
              <input id="apiBase" value="http://127.0.0.1:8000" />
            </label>
            <label>
              Dataset
              <input id="datasetRef" value="clean.orders" />
            </label>
            <div class="row">
              <label>
                Object Type
                <input id="objectType" value="Order" />
              </label>
              <label>
                Object ID
                <input id="objectId" value="O-1001" />
              </label>
            </div>
            <label>
              Reason
              <textarea id="reason">Inventory confirmed</textarea>
            </label>
            <label>
              Ontology YAML
              <textarea id="ontologyYaml">objectTypes:
  - apiName: BrokenOrder
    primaryKey: orderId
    backing:
      dataset: clean.orders
    properties:
      - apiName: orderId
        type: string
        column: missing_order_id
</textarea>
            </label>
            <label>
              Saved Set Name
              <input id="setName" value="Pending Orders" />
            </label>
            <label>
              Link Type
              <input id="linkType" value="OrderCustomer" />
            </label>
            <div class="row">
              <label>
                Run Type
                <select id="operationType">
                  <option value="">All</option>
                  <option value="sync">Sync</option>
                  <option value="transform">Transform</option>
                  <option value="index">Index</option>
                  <option value="action">Action</option>
                  <option value="action_writeback">Action Writeback</option>
                  <option value="materialization">Materialization</option>
                  <option value="outbox">Outbox</option>
                  <option value="dead_letter">DLQ</option>
                  <option value="audit">Audit</option>
                </select>
              </label>
              <label>
                Run Status
                <input id="operationStatus" placeholder="succeeded" />
              </label>
            </div>
            <div class="row">
              <label>
                Since
                <input id="operationSince" placeholder="2026-06-10T00:00:00Z" />
              </label>
              <label>
                Until
                <input id="operationUntil" placeholder="2026-06-11T00:00:00Z" />
              </label>
            </div>
            <label>
              Run ID
              <input id="operationRunId" />
            </label>
            <div class="actions">
              <button id="healthBtn" type="button">Check</button>
              <button id="datasetBtn" type="button" class="secondary">Load Dataset</button>
              <button id="ontologyBtn" type="button" class="secondary">Validate Ontology</button>
              <button id="queryBtn" type="button" class="secondary">Load List</button>
              <button id="loadBtn" type="button" class="secondary">Load Object</button>
              <button id="approveBtn" type="button" class="danger">ApproveOrder</button>
              <button id="linkBtn" type="button" class="secondary">Load Link</button>
              <button id="saveSetBtn" type="button" class="secondary">Save Pending Set</button>
              <button id="setsBtn" type="button" class="secondary">Load Sets</button>
              <button id="runsBtn" type="button" class="secondary">Load Runs</button>
              <button id="runDetailBtn" type="button" class="secondary">Load Run Detail</button>
              <button id="sourceRunBtn" type="button" class="secondary">Source Run</button>
              <button id="retryTransformBtn" type="button" class="secondary">Retry Failed Transform</button>
              <button id="replayIndexBtn" type="button" class="secondary">Replay Index</button>
              <button id="replayFailedIndexBtn" type="button" class="secondary">Replay Failed Index</button>
              <button id="retryDlqBtn" type="button" class="secondary">Retry DLQ</button>
            </div>
          </div>
        </aside>

        <section class="stack">
          <div class="metric-strip">
            <div class="metric">
              <span>Object</span>
              <strong id="metricObject">-</strong>
            </div>
            <div class="metric">
              <span>Version</span>
              <strong id="metricVersion">-</strong>
            </div>
            <div class="metric">
              <span>Status</span>
              <strong id="metricStatus">-</strong>
            </div>
          </div>

          <div class="metric-strip">
            <div class="metric">
              <span>Failed Runs</span>
              <strong id="metricFailedRuns">-</strong>
            </div>
            <div class="metric">
              <span>Outbox</span>
              <strong id="metricOutbox">-</strong>
            </div>
            <div class="metric">
              <span>DLQ</span>
              <strong id="metricDlq">-</strong>
            </div>
          </div>

          <div class="panel">
            <header>
              <h2>Dataset Versions</h2>
            </header>
            <div class="panel-body">
              <pre id="datasetResult" class="result compact">{}</pre>
            </div>
          </div>

          <div class="panel">
            <header>
              <h2>Object List</h2>
            </header>
            <div class="panel-body">
              <pre id="queryResult" class="result compact">{}</pre>
            </div>
          </div>

          <div class="panel">
            <header>
              <h2>Ontology Validation</h2>
            </header>
            <div class="panel-body">
              <pre id="ontologyResult" class="result compact">{}</pre>
            </div>
          </div>

          <div class="panel">
            <header>
              <h2>Object Explorer</h2>
            </header>
            <div class="panel-body">
              <div class="object-card">
                <pre id="objectResult" class="result">{}</pre>
              </div>
            </div>
          </div>

          <div class="panel">
            <header>
              <h2>Saved Object Sets</h2>
            </header>
            <div class="panel-body">
              <pre id="setResult" class="result compact">{}</pre>
            </div>
          </div>

          <div class="panel">
            <header>
              <h2>Object Links</h2>
            </header>
            <div class="panel-body">
              <pre id="linkResult" class="result compact">[]</pre>
            </div>
          </div>

          <div class="panel">
            <header>
              <h2>Operations</h2>
            </header>
            <div class="panel-body">
              <pre id="runResult" class="result compact">{}</pre>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module">
      import { createFoundryLiteClient, expectedObjectVersion, idempotencyKey } from "./generated-sdk.js";

      const apiBase = document.querySelector("#apiBase");
      const statusDot = document.querySelector("#statusDot");
      const statusText = document.querySelector("#statusText");
      const datasetRef = document.querySelector("#datasetRef");
      const ontologyYaml = document.querySelector("#ontologyYaml");
      const objectType = document.querySelector("#objectType");
      const objectId = document.querySelector("#objectId");
      const reason = document.querySelector("#reason");
      const setName = document.querySelector("#setName");
      const linkType = document.querySelector("#linkType");
      const operationType = document.querySelector("#operationType");
      const operationStatus = document.querySelector("#operationStatus");
      const operationSince = document.querySelector("#operationSince");
      const operationUntil = document.querySelector("#operationUntil");
      const operationRunId = document.querySelector("#operationRunId");
      const datasetResult = document.querySelector("#datasetResult");
      const queryResult = document.querySelector("#queryResult");
      const ontologyResult = document.querySelector("#ontologyResult");
      const objectResult = document.querySelector("#objectResult");
      const setResult = document.querySelector("#setResult");
      const linkResult = document.querySelector("#linkResult");
      const runResult = document.querySelector("#runResult");
      const metricObject = document.querySelector("#metricObject");
      const metricVersion = document.querySelector("#metricVersion");
      const metricStatus = document.querySelector("#metricStatus");
      const metricFailedRuns = document.querySelector("#metricFailedRuns");
      const metricOutbox = document.querySelector("#metricOutbox");
      const metricDlq = document.querySelector("#metricDlq");

      let currentObject = null;
      let currentRuns = null;
      const runGroupByType = {
        sync: "syncRuns",
        transform: "transformRuns",
        index: "indexRuns",
        action: "actionRuns",
        action_writeback: "actionWritebacks",
        materialization: "materializationRuns",
        outbox: "outboxEvents",
        dead_letter: "deadLetterEvents",
        audit: "auditEvents",
      };
      const demoHeaders = {
        "X-User-ID": "web-demo-operator",
        "X-Roles": "ops_manager,data_engineer,finance",
      };

      function sdkClient() {
        return createFoundryLiteClient({
          baseUrl: apiBase.value,
          headers: demoHeaders,
        });
      }

      function show(value) {
        objectResult.textContent = JSON.stringify(value, null, 2);
        if (value.objectId) {
          metricObject.textContent = value.objectId;
          metricVersion.textContent = value.objectVersion ?? "-";
          metricStatus.textContent = value.properties?.status ?? "-";
        }
      }

      function showDataset(value) {
        datasetResult.textContent = JSON.stringify(value, null, 2);
      }

      function showQuery(value) {
        queryResult.textContent = JSON.stringify(value, null, 2);
      }

      function showOntology(value) {
        ontologyResult.textContent = JSON.stringify(value, null, 2);
      }

      function showSet(value) {
        setResult.textContent = JSON.stringify(value, null, 2);
      }

      function showLinks(value) {
        linkResult.textContent = JSON.stringify(value, null, 2);
      }

      function showRuns(value) {
        currentRuns = value;
        runResult.textContent = JSON.stringify(value, null, 2);
        const runGroups = [
          "syncRuns",
          "transformRuns",
          "indexRuns",
          "actionRuns",
          "actionWritebacks",
          "materializationRuns",
        ];
        const failedRuns = runGroups
          .flatMap((key) => value[key] ?? [])
          .filter((row) => String(row.status ?? "").toLowerCase().includes("fail"));
        metricFailedRuns.textContent = failedRuns.length;
        metricOutbox.textContent = (value.outboxEvents ?? []).length;
        metricDlq.textContent = (value.deadLetterEvents ?? []).length;
      }

      function operationQuery() {
        const params = new URLSearchParams();
        if (operationType.value) {
          params.set("runType", operationType.value);
        }
        if (operationStatus.value) {
          params.set("status", operationStatus.value);
        }
        if (operationSince.value) {
          params.set("since", operationSince.value);
        }
        if (operationUntil.value) {
          params.set("until", operationUntil.value);
        }
        const query = params.toString();
        return query ? `?${query}` : "";
      }

      async function request(path, options = {}) {
        const headers = { ...demoHeaders, ...(options.headers ?? {}) };
        const response = await fetch(`${apiBase.value}${path}`, { ...options, headers });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw body;
        }
        return body;
      }

      async function checkHealth() {
        try {
          const health = await request("/healthz");
          statusDot.classList.add("ok");
          statusText.textContent = health.status;
        } catch (error) {
          statusDot.classList.remove("ok");
          statusText.textContent = "API unavailable";
          show(error);
        }
      }

      async function loadObject() {
        const objectClient = sdkClient().objects[objectType.value];
        currentObject = objectClient
          ? await objectClient.get(objectId.value, { explain: true })
          : await request(`/api/objects/${objectType.value}/${objectId.value}?explain=true`);
        show(currentObject);
      }

      function datasetParts() {
        const [namespace, ...rest] = datasetRef.value.split(".");
        return { namespace, name: rest.join(".") };
      }

      async function loadDataset() {
        const { namespace, name } = datasetParts();
        const versions = await request(
          `/api/datasets/${encodeURIComponent(namespace)}/${encodeURIComponent(name)}/versions`
        );
        const preview = await request(
          `/api/datasets/${encodeURIComponent(namespace)}/${encodeURIComponent(name)}/preview?limit=3`
        );
        showDataset({ dataset: datasetRef.value, versions, preview });
      }

      async function loadObjectList() {
        const objectClient = sdkClient().objects[objectType.value];
        const payload = { filter: { property: "status", op: "eq", value: "PENDING" }, limit: 5 };
        const result = objectClient
          ? await objectClient.query(payload)
          : await request(`/api/objects/${encodeURIComponent(objectType.value)}/query`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
        showQuery(result);
      }

      async function validateOntology() {
        const result = await request("/api/ontology/validate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ yaml: ontologyYaml.value }),
        });
        showOntology(result);
      }

      async function loadLinks() {
        const links = await request(
          `/api/objects/${encodeURIComponent(objectType.value)}/${encodeURIComponent(objectId.value)}/links/${encodeURIComponent(linkType.value)}`
        );
        showLinks(links);
      }

      async function approveOrder() {
        if (!currentObject) {
          await loadObject();
        }
        const action = await sdkClient().actions.ApproveOrder.apply({
          objectId: objectId.value,
          expectedObjectVersion: expectedObjectVersion(currentObject),
          params: { reason: reason.value },
          idempotencyKey: idempotencyKey("ApproveOrder", objectId.value),
        });
        show(action);
        await loadObject();
        await loadSets();
        await loadRuns();
      }

      async function savePendingSet() {
        const created = await request("/api/object-sets", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: setName.value,
            objectType: objectType.value,
            setType: "dynamic",
            visibility: "private",
            filter: { property: "status", op: "eq", value: "PENDING" },
          }),
        });
        showSet(created);
      }

      async function loadSets() {
        const sets = await request(`/api/object-sets?objectType=${encodeURIComponent(objectType.value)}`);
        showSet(sets);
      }

      async function loadRuns() {
        const runs = await request(`/api/operations/runs${operationQuery()}`);
        showRuns(runs);
      }

      async function loadRunDetail() {
        const runType = operationType.value || "action";
        const runGroup = runGroupByType[runType];
        let runId = operationRunId.value;
        let runs = currentRuns;
        if (!runId) {
          runs = await request(`/api/operations/runs?runType=${encodeURIComponent(runType)}`);
          const row = (runs[runGroup] ?? [])[0];
          if (!row?.id) {
            showRuns({ ...runs, runDetail: { status: "skipped", reason: "no run found", runType } });
            return;
          }
          runId = row.id;
          operationRunId.value = runId;
        }
        const detail = await request(
          `/api/operations/runs/${encodeURIComponent(runType)}/${encodeURIComponent(runId)}`
        );
        showRuns({ ...(runs ?? {}), runDetail: detail });
      }

      async function loadSourceRunDetail() {
        if (!currentObject) {
          await loadObject();
        }
        const link = (currentObject?.explain?.sourceRunChain ?? [])[0];
        if (!link?.runType || !link?.runId) {
          showRuns({ ...(currentRuns ?? {}), sourceRun: { status: "skipped", reason: "no source run chain" } });
          return;
        }
        operationType.value = link.runType;
        operationStatus.value = "";
        operationRunId.value = link.runId;
        const detail = await request(
          link.operationPath ?? `/api/operations/runs/${encodeURIComponent(link.runType)}/${encodeURIComponent(link.runId)}`
        );
        const runs = await request(`/api/operations/runs?runType=${encodeURIComponent(link.runType)}`);
        showRuns({ ...runs, sourceRun: link, runDetail: detail });
      }

      async function replayObjectIndex() {
        const replay = await request(`/api/operations/index/${encodeURIComponent(objectType.value)}/replay`, {
          method: "POST",
        });
        const runs = await request("/api/operations/runs?runType=index");
        operationType.value = "index";
        operationStatus.value = "";
        operationRunId.value = replay.index_run_id;
        showRuns({ ...runs, lastReplay: replay });
      }

      async function retryFailedTransformRun() {
        let runId = operationRunId.value;
        let runs = currentRuns;
        if (!runId) {
          runs = await request("/api/operations/runs?runType=transform&status=failed");
          const row = (runs.transformRuns ?? [])[0];
          if (!row?.id) {
            showRuns({ ...runs, lastTransformRetry: { status: "skipped", reason: "no failed transform run" } });
            return;
          }
          runId = row.id;
        }
        const retry = await request(`/api/operations/runs/transform/${encodeURIComponent(runId)}/retry`, {
          method: "POST",
        });
        const refreshed = await request("/api/operations/runs?runType=transform");
        operationType.value = "transform";
        operationStatus.value = "";
        operationRunId.value = retry.transform_run_id;
        showRuns({ ...refreshed, lastTransformRetry: retry });
      }

      async function replayFailedIndexRun() {
        let runId = operationRunId.value;
        let runs = currentRuns;
        if (!runId) {
          runs = await request("/api/operations/runs?runType=index&status=failed");
          const row = (runs.indexRuns ?? [])[0];
          if (!row?.id) {
            showRuns({ ...runs, lastFailedReplay: { status: "skipped", reason: "no failed index run" } });
            return;
          }
          runId = row.id;
        }
        const replay = await request(`/api/operations/runs/index/${encodeURIComponent(runId)}/replay`, {
          method: "POST",
        });
        const refreshed = await request("/api/operations/runs?runType=index");
        operationType.value = "index";
        operationStatus.value = "";
        operationRunId.value = replay.index_run_id;
        showRuns({ ...refreshed, lastFailedReplay: replay });
      }

      async function retryFirstDlq() {
        const runs = await request("/api/operations/runs");
        const event = (runs.deadLetterEvents ?? [])[0];
        if (!event?.id) {
          showRuns({ ...runs, lastRetry: { status: "skipped", reason: "no DLQ events" } });
          return;
        }
        const retry = await request(`/api/operations/dead-letter-events/${encodeURIComponent(event.id)}/retry`, {
          method: "POST",
        });
        const refreshed = await request("/api/operations/runs");
        showRuns({ ...refreshed, lastRetry: retry });
      }

      async function restoreFromServer() {
        await checkHealth();
        if (statusText.textContent !== "ok") {
          return;
        }
        await Promise.all([
          loadDataset().catch(showDataset),
          loadObjectList().catch(showQuery),
          loadObject().catch(show),
          loadLinks().catch(showLinks),
        ]);
      }

      document.querySelector("#healthBtn").addEventListener("click", checkHealth);
      document.querySelector("#datasetBtn").addEventListener("click", () => loadDataset().catch(showDataset));
      document.querySelector("#ontologyBtn").addEventListener("click", () => validateOntology().catch(showOntology));
      document.querySelector("#queryBtn").addEventListener("click", () => loadObjectList().catch(showQuery));
      document.querySelector("#loadBtn").addEventListener("click", () => loadObject().catch(show));
      document.querySelector("#approveBtn").addEventListener("click", () => approveOrder().catch(show));
      document.querySelector("#linkBtn").addEventListener("click", () => loadLinks().catch(showLinks));
      document.querySelector("#saveSetBtn").addEventListener("click", () => savePendingSet().catch(showSet));
      document.querySelector("#setsBtn").addEventListener("click", () => loadSets().catch(showSet));
      document.querySelector("#runsBtn").addEventListener("click", () => loadRuns().catch(showRuns));
      document.querySelector("#runDetailBtn").addEventListener("click", () => loadRunDetail().catch(showRuns));
      document.querySelector("#sourceRunBtn").addEventListener("click", () => loadSourceRunDetail().catch(showRuns));
      document
        .querySelector("#retryTransformBtn")
        .addEventListener("click", () => retryFailedTransformRun().catch(showRuns));
      document.querySelector("#replayIndexBtn").addEventListener("click", () => replayObjectIndex().catch(showRuns));
      document
        .querySelector("#replayFailedIndexBtn")
        .addEventListener("click", () => replayFailedIndexRun().catch(showRuns));
      document.querySelector("#retryDlqBtn").addEventListener("click", () => retryFirstDlq().catch(showRuns));
      restoreFromServer();
    </script>
  </body>
</html>
