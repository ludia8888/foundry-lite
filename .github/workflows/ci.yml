name: Foundry-lite CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Go for gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check PR root-cause evidence
        if: github.event_name == 'pull_request'
        run: uv run python scripts/quality/check_pr_root_cause_section.py --event-path "$GITHUB_EVENT_PATH"

      - name: Run release gate
        run: pnpm ci:gate

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-lite-quality-artifacts
          path: artifacts
