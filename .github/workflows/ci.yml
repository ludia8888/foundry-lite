name: Foundry-lite CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundry-lite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_static:
    name: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Go for gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check PR root-cause evidence
        if: github.event_name == 'pull_request'
        run: uv run python scripts/quality/check_pr_root_cause_section.py --event-path "$GITHUB_EVENT_PATH"

      - name: Run static quality lane
        run: pnpm ci:gate:static

      - name: Upload static artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-static-artifacts
          path: artifacts
          retention-days: 30

  quality_coverage:
    name: quality-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tesseract OCR and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Cache faster-whisper tiny model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-whisper-tiny-bge-small-clip-vit-b32-v1

      - name: Pre-fetch faster-whisper tiny model
        run: uv run python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8')"

      - name: Pre-fetch fastembed embedding model
        run: uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Pre-fetch fastembed CLIP vision/text models
        run: uv run python -c "from fastembed import ImageEmbedding, TextEmbedding; ImageEmbedding('Qdrant/clip-ViT-B-32-vision'); TextEmbedding('Qdrant/clip-ViT-B-32-text')"

      - name: Run coverage quality lane
        run: pnpm ci:gate:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-coverage-artifacts
          path: artifacts
          retention-days: 30

  quality_runtime:
    name: quality-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tesseract OCR and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Cache faster-whisper tiny model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-whisper-tiny-bge-small-clip-vit-b32-v1

      - name: Pre-fetch faster-whisper tiny model
        run: uv run python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8')"

      - name: Pre-fetch fastembed embedding model
        run: uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Pre-fetch fastembed CLIP vision/text models
        run: uv run python -c "from fastembed import ImageEmbedding, TextEmbedding; ImageEmbedding('Qdrant/clip-ViT-B-32-vision'); TextEmbedding('Qdrant/clip-ViT-B-32-text')"

      - name: Run runtime quality lane
        run: pnpm ci:gate:runtime

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-runtime-artifacts
          path: artifacts
          retention-days: 30

  quality_e2e:
    name: quality-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E quality lane
        run: pnpm ci:gate:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-e2e-artifacts
          path: artifacts
          retention-days: 30

  quality_gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality_static
      - quality_coverage
      - quality_runtime
      - quality_e2e
    if: always()
    steps:
      - name: Verify all quality lanes passed
        run: |
          echo "quality-static:   ${{ needs.quality_static.result }}"
          echo "quality-coverage: ${{ needs.quality_coverage.result }}"
          echo "quality-runtime:  ${{ needs.quality_runtime.result }}"
          echo "quality-e2e:      ${{ needs.quality_e2e.result }}"

          test "${{ needs.quality_static.result }}" = "success"
          test "${{ needs.quality_coverage.result }}" = "success"
          test "${{ needs.quality_runtime.result }}" = "success"
          test "${{ needs.quality_e2e.result }}" = "success"

          echo "Foundry-lite quality gate passed: all parallel lanes succeeded."
