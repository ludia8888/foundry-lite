name: Foundry-lite CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundry-lite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_pr:
    name: quality-pr-fast
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # This is the branch-protection latency contract. The gate itself reserves
    # 420 seconds for checks and leaves the rest for cache restore/setup.
    # The budget was 210s while PRs stayed small. A 385-file change needed ~336s
    # of directly-related tests alone on a 4-vCPU runner, and runner variance
    # moved that figure by a third between two runs of the same commit, so the
    # contract now buys headroom instead of forcing large changes to either
    # split into artificial increments or skip evidence.
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Classify pull-request change scope
        id: scope
        env:
          FOUNDRY_LITE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FOUNDRY_LITE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/quality/pr_fast_gate.py plan --github-output "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore Python environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: pr-venv-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Python dependencies
        run: uv sync --all-groups --frozen

      # The secret scan belongs before the merge, not after it. A credential caught on the main
      # push is already in history permanently, where reverting the commit does not remove it.
      - name: Set up Go for gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check PR root-cause evidence
        run: uv run python scripts/quality/check_pr_root_cause_section.py --event-path "$GITHUB_EVENT_PATH"

      - name: Set up pnpm
        if: steps.scope.outputs.should_install_node == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        if: steps.scope.outputs.should_install_node == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        if: steps.scope.outputs.should_install_node == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build isolated Python execution image
        if: steps.scope.outputs.should_build_code_execution_image == 'true'
        run: pnpm --silent quality:code-execution-image

      - name: Run budgeted pull-request gate
        env:
          FOUNDRY_LITE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FOUNDRY_LITE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci_gate.sh pr

      - name: Upload pull-request gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-pr-fast-gate
          path: artifacts/quality
          retention-days: 14
          if-no-files-found: warn

  quality_static:
    name: quality-static
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Go for gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run static quality lane
        run: pnpm ci:gate:static

      - name: Upload static artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-static-artifacts
          path: artifacts
          retention-days: 30

  quality_coverage:
    name: quality-coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Coverage runs the full backend suite sharded across xdist workers, one file per worker.
    # This lane was serial until the claim behind that choice was measured: sharding was said to
    # misattribute import-time lines and weaken the per-layer signal, but pytest-cov combines one
    # data file per worker and a combine is a union, so serial and sharded runs agree exactly —
    # identical lines, branches, partial branches, and per-file summaries across 949 files.
    # scripts/ci_gate.sh carries the full measurement.
    #
    # 40 (was 60, was 45): 45 was breached at 45m18s after a completed run at 39m31s, so the cap
    # went to 60 to stop a timeout from destroying the measurement it protects — three
    # consecutive main pushes had produced no coverage number at all. Sharding then took the
    # lane to 20m12s (run 31062709490), so 60 is now loose enough to let a hang burn 40 idle
    # minutes. 40 keeps roughly double the one sharded observation, which covers the ~⅓ runner
    # variance this repo shows without sitting close to the cap.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tesseract OCR, Poppler, and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils ffmpeg

      - name: Cache faster-whisper tiny model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-whisper-tiny-bge-small-clip-vit-b32-v1

      - name: Pre-fetch faster-whisper tiny model
        run: uv run python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8')"

      - name: Pre-fetch fastembed embedding model
        run: uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Pre-fetch fastembed CLIP vision/text models
        run: uv run python -c "from fastembed import ImageEmbedding, TextEmbedding; ImageEmbedding('Qdrant/clip-ViT-B-32-vision'); TextEmbedding('Qdrant/clip-ViT-B-32-text')"

      - name: Run coverage quality lane
        run: pnpm ci:gate:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-coverage-artifacts
          path: artifacts
          retention-days: 30

  quality_runtime:
    name: quality-runtime
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tesseract OCR, Poppler, and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils ffmpeg

      - name: Cache faster-whisper tiny model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-whisper-tiny-bge-small-clip-vit-b32-v1

      - name: Pre-fetch faster-whisper tiny model
        run: uv run python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8')"

      - name: Pre-fetch fastembed embedding model
        run: uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Pre-fetch fastembed CLIP vision/text models
        run: uv run python -c "from fastembed import ImageEmbedding, TextEmbedding; ImageEmbedding('Qdrant/clip-ViT-B-32-vision'); TextEmbedding('Qdrant/clip-ViT-B-32-text')"

      - name: Run runtime quality lane
        run: pnpm ci:gate:runtime

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-runtime-artifacts
          path: artifacts
          retention-days: 30

  quality_e2e:
    name: quality-e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and verify document and media processors
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ffmpeg
          command -v tesseract
          command -v pdftoppm
          command -v pdfimages
          command -v ffprobe

      # The seeded browser runtime exercises AI/content paths during API
      # startup. Downloading these models inside Playwright's webServer
      # readiness window makes a cold GitHub runner fail before tests begin.
      - name: Cache faster-whisper and fastembed models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-whisper-tiny-bge-small-clip-vit-b32-v1

      - name: Pre-fetch faster-whisper tiny model
        run: uv run python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8')"

      - name: Pre-fetch fastembed embedding model
        run: uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Pre-fetch fastembed CLIP vision/text models
        run: uv run python -c "from fastembed import ImageEmbedding, TextEmbedding; ImageEmbedding('Qdrant/clip-ViT-B-32-vision'); TextEmbedding('Qdrant/clip-ViT-B-32-text')"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E quality lane
        run: pnpm ci:gate:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-quality-e2e-artifacts
          path: artifacts
          retention-days: 30

  quality_gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality_pr
      - quality_static
      - quality_coverage
      - quality_runtime
      - quality_e2e
    if: always()
    steps:
      - name: Verify all quality lanes passed
        run: |
          echo "quality-pr-fast: ${{ needs.quality_pr.result }}"
          echo "quality-static:   ${{ needs.quality_static.result }}"
          echo "quality-coverage: ${{ needs.quality_coverage.result }}"
          echo "quality-runtime:  ${{ needs.quality_runtime.result }}"
          echo "quality-e2e:      ${{ needs.quality_e2e.result }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "${{ needs.quality_pr.result }}" = "success"
            test "${{ needs.quality_static.result }}" = "skipped"
            test "${{ needs.quality_coverage.result }}" = "skipped"
            test "${{ needs.quality_runtime.result }}" = "skipped"
            test "${{ needs.quality_e2e.result }}" = "skipped"
            echo "Foundry-lite PR quality gate passed inside the budgeted merge window."
          else
            test "${{ needs.quality_pr.result }}" = "skipped"
            test "${{ needs.quality_static.result }}" = "success"
            test "${{ needs.quality_coverage.result }}" = "success"
            test "${{ needs.quality_runtime.result }}" = "success"
            test "${{ needs.quality_e2e.result }}" = "success"
            echo "Foundry-lite main quality gate passed: all full parallel lanes succeeded."
          fi
