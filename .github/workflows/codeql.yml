name: CodeQL P7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly fresh DB rebuild so the upstream security pack stays current.
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  pr_diff_security:
    # Keep the historical required-check name so branch protection needs no
    # manual rewrite. The log is explicit that full CodeQL follows on main.
    name: CodeQL data-flow analysis
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run bounded PR diff security guard
        env:
          FOUNDRY_LITE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FOUNDRY_LITE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/quality/pr_fast_gate.py security

      - name: Explain full security evidence boundary
        run: echo "Full CodeQL, Semgrep, gitleaks, Bandit, and pip-audit evidence runs after merge on main and before release."

  analyze:
    name: CodeQL data-flow analysis (full)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # Run the default security-extended pack PLUS our repo-local custom
          # queries. The custom queries cite Foundry-lite guideline sections.
          queries: +./scripts/quality/codeql/queries
          packs: codeql/python-queries

      - name: Build CodeQL database
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          upload: always
          # Output SARIF so PR annotations link directly to lines.
          output: codeql-results

      - name: Fail on CodeQL findings
        run: python scripts/quality/codeql/fail_on_sarif_findings.py codeql-results

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results/
          retention-days: 30
