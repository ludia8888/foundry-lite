name: CodeQL P7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly fresh DB rebuild so the upstream security pack stays current.
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL data-flow analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Run the default security-extended pack PLUS our repo-local custom
          # queries. The custom queries cite Foundry-lite guideline sections.
          queries: +./scripts/quality/codeql/queries
          packs: codeql/python-queries

      - name: Build CodeQL database
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
          upload: always
          # Output SARIF so PR annotations link directly to lines.
          output: codeql-results

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results/
          retention-days: 30
