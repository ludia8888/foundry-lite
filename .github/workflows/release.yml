name: Foundry-lite Release Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-lite-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_gate:
    name: release-gate
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      # Release replays the complete suite after coverage has already warmed the
      # runner. A healthy 6.9k-test replay reached 900 seconds, so retain a
      # bounded 20-minute per-iteration ceiling without reducing the 3 runs.
      FOUNDRY_LITE_FLAKY_ITERATION_TIMEOUT_SECONDS: "1200"
    # The release lane intentionally keeps coverage, three randomized full-suite
    # replays, live-runtime ratchets, and the 100k/1m performance smokes together.
    # A measured run reached the performance smokes only after 90 minutes and a
    # healthy randomized replay later reached the old 15-minute iteration limit.
    # Keep a bounded 180-minute budget rather than dropping release evidence.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Java for Spark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go for gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tesseract OCR, Poppler, and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils ffmpeg

      - name: Cache faster-whisper and fastembed models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ${{ env.FASTEMBED_CACHE_PATH }}
          key: hf-fastembed-models-whisper-tiny-bge-small-clip-vit-b32-v2

      - name: Pre-fetch faster-whisper tiny model
        run: uv run python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8')"

      - name: Pre-fetch fastembed embedding model
        run: uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Pre-fetch fastembed CLIP vision/text models
        run: uv run python -c "from fastembed import ImageEmbedding, TextEmbedding; ImageEmbedding('Qdrant/clip-ViT-B-32-vision'); TextEmbedding('Qdrant/clip-ViT-B-32-text')"

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run release evidence gate
        run: pnpm ci:gate:release

      - name: Upload release evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundry-lite-release-evidence
          path: |
            artifacts/quality/proof_matrix.json
            artifacts/quality/proof_matrix_summary.md
            artifacts/quality/source_of_truth_contract.json
            artifacts/quality/source_of_truth_summary.md
            artifacts/quality/operator_evidence.json
            artifacts/quality/operator_evidence_summary.md
            artifacts/quality/runtime_root_cause_summary.md
            artifacts/quality/flaky_detector.json
            artifacts/diagnostics
          retention-days: 90
          if-no-files-found: warn
