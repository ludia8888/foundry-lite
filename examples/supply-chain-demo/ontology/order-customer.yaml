interfaces:
  - apiName: Asset
    displayName: Asset
    properties:
      - apiName: riskScore
        type: float
        indexed: true
objectTypes:
  - apiName: Order
    displayName: Order
    implements: [Asset]
    primaryKey: orderId
    titleProperty: orderId
    backing:
      mode: snapshot
      datasources:
        - name: erp
          dataset: clean.orders
          primaryKeyColumns: [order_id]
        - name: finance
          dataset: clean.order_finance
          primaryKeyColumns: [order_id]
          requiredRole: finance
    materialization:
      dataset: ops.order_current
      mode: object_snapshot
    properties:
      - apiName: orderId
        column: order_id
        type: string
        indexed: true
        nullable: false
      - apiName: customerId
        column: customer_id
        type: string
        indexed: true
        nullable: false
      - apiName: status
        column: source_status
        type: string
        indexed: true
        editable: true
        editPolicy: edit_wins
      - apiName: amount
        column: amount
        type: float
      - apiName: margin
        column: margin
        type: float
        classification: finance
        datasource: finance
      - apiName: riskScore
        column: risk_score
        type: float
        indexed: true
      - apiName: operatorNote
        type: string
        searchable: true
        editable: true
        source: edit_layer
        editPolicy: edit_only
  - apiName: Customer
    displayName: Customer
    implements: [Asset]
    primaryKey: customerId
    titleProperty: name
    backing:
      dataset: clean.customers
      mode: snapshot
      primaryKeyColumns: [customer_id]
    properties:
      - apiName: customerId
        column: customer_id
        type: string
        indexed: true
        nullable: false
      - apiName: name
        column: customer_name
        type: string
      - apiName: segment
        column: segment
        type: string
      - apiName: region
        column: region
        type: string
      - apiName: riskScore
        column: risk_score
        type: float
        indexed: true
      - apiName: approvedOrderCount
        column: approved_order_count
        type: integer
        indexed: true
linkTypes:
  - apiName: OrderCustomer
    displayName: Order belongs to Customer
    from: Order
    to: Customer
    cardinality: many_to_one
    backing:
      dataset: clean.orders
      fromKey: order_id
      toKey: customer_id
functionTypes:
  - apiName: orderRiskSummary
    displayName: Order risk summary
    runtime: logic_dag
    inputs:
      - apiName: objectId
        type: string
        required: true
    output:
      type: string
    permissions:
      allowedRoles: [ops_manager]
    definition:
      tools:
        - toolId: ontology.get_object
          version: "2026-06-25"
          effect: READ
          confirmationPolicy: NONE
          requiredPermission: object:read
          inputSchema:
            type: object
            required: [object_type, object_id]
            properties:
              object_type: {type: string}
              object_id: {type: string}
              property_names: {type: array}
          outputSchema:
            type: object
          objectTypeAllowlist: [Order]
          propertyAllowlist: [riskScore, status]
          resultClassification: internal
      blocks:
        - blockId: input
          kind: Input
        - blockId: read_order
          kind: CallFunction
          dependsOn: [input]
          inputs:
            toolId: ontology.get_object
            version: "2026-06-25"
            arguments:
              object_type: Order
              object_id: O-1001
              property_names: [riskScore, status]
        - blockId: output
          kind: Output
          dependsOn: [read_order]
          inputs:
            fromBlock: read_order
actionTypes:
  - apiName: ApproveOrder
    displayName: Approve order
    target: Order
    parameters:
      - apiName: reason
        type: string
        required: true
    permissions:
      allowedRoles: [ops_manager]
    preconditions:
      - safeExpression: "object.status in ['PENDING', 'REVIEW']"
        message: "Only pending/review orders can be approved"
    mutations:
      - type: setProperty
        property: status
        value: APPROVED
      - type: setProperty
        property: operatorNote
        valueFrom: params.reason
    writebacks:
      - apiName: erpApproveOrder
        mode: beforeCommit
        connector: mock_erp_simulator
    sideEffects:
      - type: event
        topic: ops.order.approved
